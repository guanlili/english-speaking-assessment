# 依赖安全审计：PR 阶段把关 + 每周一兜底。
#
# 历史上这里只跑 schedule，等于留了两道口子：
#   1) 两次扫描之间最长 7 天，任何高危依赖都能被合进 master；
#   2) 而且它连续 6 周全部 failure，兜底根本没生效——
#      后端那侧 `uv export` 把项目自身导成了 `-e ./backend`，pip-audit 在临时 venv
#      里装不上这个相对路径；前端那侧是真在报 4 个 js-yaml high，但失败只发邮件，
#      没人看见。
#
# 现在 PR 阶段也跑，并作为分支保护的 required check。
name: 依赖审计

# 审计只需读仓库内容；显式声明最小权限
permissions:
  contents: read

on:
  pull_request:
  schedule:
    - cron: "0 2 * * 1" # 每周一 10:00（北京时间）
  workflow_dispatch:

# 原来固定 group + cancel-in-progress 会让 PR 触发的运行与定时任务互相取消；
# 按 ref 区分后，只在同一个 ref 内取消重复运行
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 pip-audit
    # 钉住 runner 镜像（2026-10-23 latest 切 26.04 的事故教训；audit 虽不跑
    # 浏览器没被 icu 波及，但同样不留漂移面）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: 导出锁定依赖并审计
        working-directory: backend
        run: |
          # --no-emit-project 排除项目自身。少了它会导出 `-e ./backend`，
          # pip-audit 在临时 venv 里无法安装这个相对路径，审计直接失败。
          uv export --format requirements-txt --no-hashes --no-dev \
            --no-emit-project -o /tmp/req.txt
          uvx pip-audit --requirement /tmp/req.txt
  frontend:
    name: 前端 npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 审计依赖（high 及以上）
        working-directory: frontend
        run: |
          # 显式指官方源：镜像源（如 npmmirror）不实现 /-/npm/v1/security/* 端点，
          # 本地用镜像时会直接 404，看起来像审计本身坏了
          npm audit --package-lock-only --audit-level=high \
            --registry=https://registry.npmjs.org
