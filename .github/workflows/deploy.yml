name: CI

# 最小 token 权限：所有 CI job（缓存/产物）都只需读仓库内容，
# 显式声明以免随仓库默认设置漂移到 read/write。
# 本 workflow 只跑检查，不触碰生产；生产部署见 deploy-prod.yml（手动触发）。
permissions:
  contents: read

on:
  push:
    branches: [master]
    # 纯文档/评审产物改动不烧 14 分钟 E2E
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reviews/**"
      - "prototypes/**"
      - "gui-test-screenshots/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reviews/**"
      - "prototypes/**"
      - "gui-test-screenshots/**"
  workflow_dispatch:

# CI 检查按分支分组排队；PR 连续推修复时打断过期的全量检查（省 runner
# 分钟——缓存全命中时一次全链路约 7 分钟），master 与手动触发不打断进行中的检查
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  backend:
    name: 后端 Lint + 测试
    runs-on: ubuntu-24.04
    # 挂起保护：无 timeout 时挂起的 job 会占住 runner 直到 GitHub 默认 6 小时
    timeout-minutes: 30
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1025:1025
    env:
      # 覆盖 .env 中面向 docker 网络的配置，CI 里服务都在 localhost
      POSTGRES_SERVER: localhost
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: noreply@example.com
    steps:
      - uses: actions/checkout@v7
      - name: 校验 .env.example 与 deploy.yml 写入的键一致
        run: |
          if ! diff <(grep -oE '^[A-Za-z_]+=' .env.example | tr -d '=' | sort) \
                    <(sed -n 's/^ *keys=(\(.*\)).*/\1/p' scripts/generate-deploy-env.sh \
                      | tr ' ' '\n' | sed '/^$/d' | sort); then
            echo "❌ .env.example 与 generate-deploy-env.sh 的 keys 清单（写入 .env 的键）不一致。"
            echo "   新增/删除配置项时必须两边同步，否则该变量在生产上是空值（静默失效）。"
            exit 1
          fi
      - name: 部署配置回归检查
        run: |
          python3 scripts/test_deploy.py
          python3 scripts/test_backup.py
          # 回滚脚本只在生产事故时被人手动执行——语法错误拖到那一刻才发现就晚了
          bash -n scripts/rollback.sh
      - name: 校验 uv.lock 不含镜像源 URL
        run: |
          if grep -qE "tuna\.tsinghua|mirrors\.aliyun|mirrors\.cloud\.tencent|mirrors\.163" uv.lock; then
            echo "❌ uv.lock 内嵌了国内镜像 URL——CI 是海外 runner，下载国内镜像慢且被限流"
            echo "   （2026-10-12 曾因清华镜像 403 整 job 失败）。请在官方源上重新锁版："
            echo "   UV_DEFAULT_INDEX=https://pypi.org/simple uv lock"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - name: 准备环境变量
        run: cp .env.example .env
      - name: 安装依赖
        timeout-minutes: 10
        run: uv sync
      - name: Lint（ty + ruff，覆盖 app 与 tests）
        working-directory: backend
        run: uv run bash scripts/lint.sh
      - name: 数据库迁移 + 初始数据（应用库，验证迁移链）
        working-directory: backend
        run: uv run bash scripts/prestart.sh
      - name: 运行测试（独立测试库 app_test，由 conftest 自动创建）
        working-directory: backend
        run: uv run bash scripts/tests-start.sh
      # 测试库由 conftest 用 create_all 按模型建表：改了 models 忘生成迁移时
      # 测试照常全绿，问题拖到生产缺列才爆。此步骤在"迁移链建出的库"上
      # autogenerate，有任何 diff 即失败。
      - name: 迁移-模型一致性校验
        working-directory: backend
        env:
          POSTGRES_DB: alembic_drift_check
        run: |
          uv run python - <<'EOF'
          from sqlalchemy import create_engine, text
          from app.core.config import settings
          base = str(settings.SQLALCHEMY_DATABASE_URI).rsplit("/", 1)[0]
          engine = create_engine(f"{base}/postgres", isolation_level="AUTOCOMMIT")
          with engine.connect() as conn:
              conn.execute(text('DROP DATABASE IF EXISTS "alembic_drift_check"'))
              conn.execute(text('CREATE DATABASE "alembic_drift_check"'))
          EOF
          uv run alembic upgrade head
          uv run alembic revision --autogenerate -m "ci drift check"
          marker="ci drift check"
          file=$(grep -rl "$marker" app/alembic/versions/ | head -1 || true)
          if [ -n "$file" ]; then
            if grep -qE "op\.(create|drop|add|alter)" "$file"; then
              echo "❌ models.py 与迁移存在漂移（改模型后忘记生成迁移？）："
              grep -E "op\.(create|drop|add|alter)" "$file"
              rm -f "$file"
              exit 1
            fi
            rm -f "$file"
            echo "无漂移（自动生成的空迁移已清理）"
          fi

  perf-guard:
    name: 性能回归守卫（查询数）
    runs-on: ubuntu-24.04
    # 与 backend/frontend 并行起跑。缓存命中时 e2e 关键路径约 6 分钟，本 job
    # 建库 + seed + 测量约 2 分钟，藏在那 6 分钟里，不拉长整轮时长。
    timeout-minutes: 15
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_SERVER: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: 准备环境变量
        run: cp .env.example .env
      - name: 安装依赖
        timeout-minutes: 10
        run: uv sync
      # 脚本在独立的 app_perf 库上建表、灌合成数据、跑完即删；安全闸要求
      # ENVIRONMENT=local 且目标必须是本机实例，误指生产在第一个 DDL 前就被拒。
      #
      # 断言的是 SELECT 次数（同一份数据、同一版代码必然相同），不是耗时：
      # runner 快慢和邻居负载会让耗时抖动几十倍，卡时间只会训练人忽略红灯。
      # 行加载只设宽松上限，容忍合成数据分布随模型演进的小幅漂移。
      - name: 查询数基线比对
        working-directory: backend
        run: uv run python scripts/perf_baseline.py --assert-baseline

  frontend:
    name: 前端 Lint + 构建 + 客户端一致性
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        timeout-minutes: 10
        working-directory: frontend
        run: npm ci
      - name: Biome 检查
        working-directory: frontend
        run: npx biome ci .
      - name: 单元测试（纯函数 + 组件渲染）
        working-directory: frontend
        run: npm test
      - name: 类型检查（源码 + 测试）
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build
      # 校验 src/client/ 与后端 OpenAPI 一致：后端接口改了但忘记 generate-client 时在这里拦下
      - uses: astral-sh/setup-uv@v7
        with:
          # 只读缓存不写：与 backend job 缓存 key 相同，双写会报 reserve cache 竞争告警，由 backend 统一写
          save-cache: false
      - name: 准备环境变量（导入 app 需要）
        run: cp .env.example .env
      - name: 安装后端依赖（导入 app.main 需要）
        working-directory: backend
        run: uv sync --no-dev
      - name: 导出后端 OpenAPI 规范
        working-directory: backend
        run: uv run python -c "import json, app.main; print(json.dumps(app.main.app.openapi()))" > ../frontend/openapi.json
      - name: 校验前端客户端无漂移
        working-directory: frontend
        run: |
          # 必须走 generate-client 脚本而非裸 npx openapi-ts：脚本含 0.99 迁移的
          # 后处理（ThrowOnError 默认值/响应类型 200 收窄/barrel 追加导出），
          # 提交物与再生成物才同构（2026-10-30 实测裸跑必报漂移）
          npm run generate-client -- --local
          if [ -n "$(git status --porcelain src/client/)" ]; then
            git status --porcelain src/client/
            git --no-pager diff src/client/ | head -100
            echo "❌ 前端 src/client/ 与后端 OpenAPI 不一致（后端接口改动后未重新生成客户端）。"
            echo "   修复：cd frontend && npm run generate-client -- --local，提交 src/client/ 的变更。"
            exit 1
          fi

  e2e-tests:
    name: E2E (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            shard: 1
            total: 1
            browsers: chromium
          - suite: mocked
            shard: 1
            total: 2
            browsers: chromium webkit
          - suite: mocked
            shard: 2
            total: 2
            browsers: chromium webkit
    runs-on: ubuntu-24.04
    # 60 分钟：浏览器缓存未命中（lockfile 变更/缓存淘汰）时 Chromium+WebKit
    # 全量下载约 20 分钟起，叠加完整栈启动与双浏览器套件（2026-10-10
    # PR#101 首次部署实测）；安装步骤自身最多 50 分钟（3×15 分钟重试，防
    # runner 网络劣化，见下方安装步骤注释）。缓存命中时全程 ~10 分钟
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: 准备环境变量（local 环境，演示登录可用）
        if: matrix.suite == 'integration'
        run: cp .env.example .env
      - name: 启动完整栈（db + backend + prestart + frontend）
        if: matrix.suite == 'integration'
        # -f 跳过本地开发的 compose.override.yml（5173 映射），用生产端口形态。
        # 曾叠加 compose.ci-build-cache.yml + buildx 构建器走 type=gha 层缓存，
        # 实测从未生效（up --build 不导出 cache_to：日志 0 条 CACHED、缓存
        # 列表 0 条 buildkit 条目），而冷构建本就只要 ~100 秒，整套拆除。
        run: docker compose -f compose.yml up -d --build
      - name: 等待就绪（prestart 迁移 + backend 健康检查，首次较慢）
        if: matrix.suite == 'integration'
        run: |
          port=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d '"')
          port=${port:-80}
          echo "frontend 端口: $port"
          for i in $(seq 1 150); do
            if curl -fsS "http://localhost:$port/api/v1/utils/ready-check/" > /dev/null 2>&1; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "❌ 栈未就绪，容器状态："
          docker compose -f compose.yml ps
          docker compose -f compose.yml logs backend --tail 30
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # integration（仅 chromium）与 mocked（双浏览器）各存各的 key；冷起的
      # integration 分片不得把只含 chromium 的缓存写进 mocked 用的 key。
      # 精确 key 未命中（lockfile 变更）时前缀兜底到兄弟套件的缓存：
      # mocked（双浏览器）是 integration 的超集可直接复用；mocked 反向命中
      # integration 时也省下 chromium 下载，只补装 webkit。
      # -icu2 前缀：2026-10-23 runner 镜像升级更换 libicu 版本，旧缓存里的
      # WebKit 二进制链接 libicu74 启动即挂（libicudata.so.74 not found），
      # 挪 key 强制冷装重建（key 与 restore 前缀一起挪，避免旧缓存兜底复活）。
      # 浏览器缓存 key 只跟 @playwright/test 版本走，不跟整个 lockfile：
      # 依赖升级（dependabot 每周动 axios/lucide-react 之类）不该让
      # Chromium+WebKit 重新下载。此前用 hashFiles 全量 lock 作 key，
      # 每次 lock 变更后两个 mocked 分片同时冷起、同时下载同一份浏览器，
      # 1/2 装完 94 秒、2/2 还在下（272 秒），凭空白等 178 秒
      # （run 42987202096 实测）。浏览器二进制只由 playwright 版本决定。
      - name: 读取 Playwright 版本
        id: pwver
        working-directory: frontend
        run: |
          ver=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "playwright $ver"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-icu2-${{ runner.os }}-pw${{ steps.pwver.outputs.version }}-${{ matrix.suite }}
          # 第二条前缀是过渡与降级兜底：旧格式 key（带 lockfile hash）改成
          # 版本 key 后首跑靠它命中；playwright 升级时也能复用 apt 依赖与
          # 未变的浏览器目录，只补装新版本，而不是整份重下。
          restore-keys: |
            playwright-icu2-${{ runner.os }}-pw${{ steps.pwver.outputs.version }}-
            playwright-icu2-${{ runner.os }}-
      - name: 安装依赖与 Chromium/WebKit
        # runner 网络劣化有两副面孔（2026-10-27 一天内实测两种）：静默挂死
        # 零输出（run 40555961170）、apt 源爬速单文件数分钟（本 PR 首跑
        # mocked 1/2，14 分钟只拉了 43/130 个文件）。单次尝试限时 15 分钟
        # （GNU timeout 把挂死/爬速转成普通失败）+ 重试 2 次：apt 已下载的
        # 包缓存在 /var/cache/apt/archives 跨尝试复用，慢而正常的安装靠
        # 累积进度过线。重试前必须清残留进程树：timeout 只杀直接子进程，
        # 孤儿 apt-get 会持有 dpkg 锁把重试毒化（本 PR 首跑实测撞锁
        # exit 100）。正常路径（缓存命中）~2 分钟不受影响；步骤 50 分钟 /
        # job 60 分钟仅在多次重试的劣化场景逼近，届时再失败与原先 15 分钟
        # 一次性判死等价，不会更糟。
        timeout-minutes: 50
        working-directory: frontend
        env:
          # 浏览器下载连接停滞时快速报错交给重试，而不是无限挂起
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
          # 浏览器二进制改走 npmmirror 镜像（与 Docker 构建国内加速同一思路；
          # 2026-10-26/27 官方 CDN 对 runner 偶发持续极慢，镜像后冷装大幅提速，
          # 重试兜底很少再需要触发）
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.npmmirror.com/binaries/playwright
        run: |
          npm ci
          for i in 1 2 3; do
            if timeout -k 30 900 npx playwright install --with-deps ${{ matrix.browsers }}; then
              exit 0
            fi
            echo "⚠️ 第 $i 次安装失败或挂起，清理残留进程后重试..."
            sudo pkill -9 -x apt-get 2>/dev/null || true
            sudo pkill -9 -x dpkg 2>/dev/null || true
            sudo pkill -9 -f "playwright install" 2>/dev/null || true
            sleep 10
            # 若上次死在 dpkg 安装中途，先修复中断状态，避免重试撞锁
            sudo dpkg --configure -a || true
          done
          exit 1
      # mocked 套件用 vite preview 服务 dist/ 静态产物：按 git 跟踪文件的
      # blob 指纹缓存，前端未变的 PR（纯后端改动/重跑）直接复用、跳过构建。
      # 指纹用 git ls-files -s 而非 hashFiles 白名单：白名单漏列任何影响
      # 构建的文件都会测到过期产物，全量跟踪文件指纹不会。
      - name: 计算前端源码指纹
        if: matrix.suite == 'mocked'
        id: fronthash
        run: echo "hash=$(git ls-files -s frontend | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: 恢复前端构建产物
        if: matrix.suite == 'mocked'
        id: distcache
        uses: actions/cache@v6
        with:
          path: frontend/dist
          key: mocked-dist-${{ runner.os }}-${{ steps.fronthash.outputs.hash }}
      - name: 构建模拟接口测试使用的前端
        if: matrix.suite == 'mocked' && steps.distcache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm run build
      - name: 运行真实后端 E2E（独立数据库，串行）
        if: matrix.suite == 'integration'
        working-directory: frontend
        run: |
          port=$(grep -E '^APP_PORT=' ../.env | cut -d= -f2 | tr -d '"')
          E2E_BASE_URL="http://localhost:${port:-80}" npx playwright test --project=chromium
      - name: 运行模拟接口 E2E（双浏览器，独立分片）
        if: matrix.suite == 'mocked'
        working-directory: frontend
        env:
          E2E_MOCK_ONLY: "true"
        run: npx playwright test --project=chromium-mock --project=webkit --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # Keep the existing required check name; deployment must wait for every shard.
  e2e:
    name: E2E 冒烟（主干道）
    needs: [e2e-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 确认所有 E2E 分片通过
        env:
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: test "$E2E_RESULT" = "success"
