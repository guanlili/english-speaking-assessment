name: CI & Deploy

# 最小 token 权限：所有 job（缓存/产物/SSH 部署）都只需读仓库内容，
# 显式声明以免随仓库默认设置漂移到 read/write
permissions:
  contents: read

on:
  push:
    branches: [master]
    # 纯文档/评审产物改动不烧 14 分钟 E2E，也不触发无意义的服务器重启
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reviews/**"
      - "prototypes/**"
      - "gui-test-screenshots/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reviews/**"
      - "prototypes/**"
      - "gui-test-screenshots/**"
  workflow_dispatch:

# CI 检查按分支分组排队；PR 连续推修复时打断过期的全量检查（省 runner
# 分钟——缓存全命中时一次全链路约 7 分钟），master 与手动触发不打断进行中的检查
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  backend:
    name: 后端 Lint + 测试
    runs-on: ubuntu-24.04
    # 挂起保护：无 timeout 时挂起的 job 会占住 runner 直到 GitHub 默认 6 小时
    timeout-minutes: 30
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1025:1025
    env:
      # 覆盖 .env 中面向 docker 网络的配置，CI 里服务都在 localhost
      POSTGRES_SERVER: localhost
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: noreply@example.com
    steps:
      - uses: actions/checkout@v7
      - name: 校验 .env.example 与 deploy.yml 写入的键一致
        run: |
          if ! diff <(grep -oE '^[A-Za-z_]+=' .env.example | tr -d '=' | sort) \
                    <(sed -n 's/^ *keys=(\(.*\)).*/\1/p' scripts/generate-deploy-env.sh \
                      | tr ' ' '\n' | sed '/^$/d' | sort); then
            echo "❌ .env.example 与 generate-deploy-env.sh 的 keys 清单（写入 .env 的键）不一致。"
            echo "   新增/删除配置项时必须两边同步，否则该变量在生产上是空值（静默失效）。"
            exit 1
          fi
      - name: 部署配置回归检查
        run: |
          python3 scripts/test_deploy.py
          python3 scripts/test_backup.py
          # 回滚脚本只在生产事故时被人手动执行——语法错误拖到那一刻才发现就晚了
          bash -n scripts/rollback.sh
      - name: 校验 uv.lock 不含镜像源 URL
        run: |
          if grep -qE "tuna\.tsinghua|mirrors\.aliyun|mirrors\.cloud\.tencent|mirrors\.163" uv.lock; then
            echo "❌ uv.lock 内嵌了国内镜像 URL——CI 是海外 runner，下载国内镜像慢且被限流"
            echo "   （2026-10-12 曾因清华镜像 403 整 job 失败）。请在官方源上重新锁版："
            echo "   UV_DEFAULT_INDEX=https://pypi.org/simple uv lock"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - name: 准备环境变量
        run: cp .env.example .env
      - name: 安装依赖
        timeout-minutes: 10
        run: uv sync
      - name: Lint（ty + ruff，覆盖 app 与 tests）
        working-directory: backend
        run: uv run bash scripts/lint.sh
      - name: 数据库迁移 + 初始数据（应用库，验证迁移链）
        working-directory: backend
        run: uv run bash scripts/prestart.sh
      - name: 运行测试（独立测试库 app_test，由 conftest 自动创建）
        working-directory: backend
        run: uv run bash scripts/tests-start.sh
      # 测试库由 conftest 用 create_all 按模型建表：改了 models 忘生成迁移时
      # 测试照常全绿，问题拖到生产缺列才爆。此步骤在"迁移链建出的库"上
      # autogenerate，有任何 diff 即失败。
      - name: 迁移-模型一致性校验
        working-directory: backend
        env:
          POSTGRES_DB: alembic_drift_check
        run: |
          uv run python - <<'EOF'
          from sqlalchemy import create_engine, text
          from app.core.config import settings
          base = str(settings.SQLALCHEMY_DATABASE_URI).rsplit("/", 1)[0]
          engine = create_engine(f"{base}/postgres", isolation_level="AUTOCOMMIT")
          with engine.connect() as conn:
              conn.execute(text('DROP DATABASE IF EXISTS "alembic_drift_check"'))
              conn.execute(text('CREATE DATABASE "alembic_drift_check"'))
          EOF
          uv run alembic upgrade head
          uv run alembic revision --autogenerate -m "ci drift check"
          marker="ci drift check"
          file=$(grep -rl "$marker" app/alembic/versions/ | head -1 || true)
          if [ -n "$file" ]; then
            if grep -qE "op\.(create|drop|add|alter)" "$file"; then
              echo "❌ models.py 与迁移存在漂移（改模型后忘记生成迁移？）："
              grep -E "op\.(create|drop|add|alter)" "$file"
              rm -f "$file"
              exit 1
            fi
            rm -f "$file"
            echo "无漂移（自动生成的空迁移已清理）"
          fi

  frontend:
    name: 前端 Lint + 构建 + 客户端一致性
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        timeout-minutes: 10
        working-directory: frontend
        run: npm ci
      - name: Biome 检查
        working-directory: frontend
        run: npx biome ci .
      - name: 单元测试（node --test）
        working-directory: frontend
        run: npm test
      - name: 类型检查 + 构建
        working-directory: frontend
        run: npm run build
      # 校验 src/client/ 与后端 OpenAPI 一致：后端接口改了但忘记 generate-client 时在这里拦下
      - uses: astral-sh/setup-uv@v7
        with:
          # 只读缓存不写：与 backend job 缓存 key 相同，双写会报 reserve cache 竞争告警，由 backend 统一写
          save-cache: false
      - name: 准备环境变量（导入 app 需要）
        run: cp .env.example .env
      - name: 安装后端依赖（导入 app.main 需要）
        working-directory: backend
        run: uv sync --no-dev
      - name: 导出后端 OpenAPI 规范
        working-directory: backend
        run: uv run python -c "import json, app.main; print(json.dumps(app.main.app.openapi()))" > ../frontend/openapi.json
      - name: 校验前端客户端无漂移
        working-directory: frontend
        run: |
          npx openapi-ts
          if [ -n "$(git status --porcelain src/client/)" ]; then
            git status --porcelain src/client/
            git --no-pager diff src/client/ | head -100
            echo "❌ 前端 src/client/ 与后端 OpenAPI 不一致（后端接口改动后未重新生成客户端）。"
            echo "   修复：docker compose up -d 后执行 cd frontend && npm run generate-client，提交 src/client/ 的变更。"
            exit 1
          fi

  e2e-tests:
    name: E2E (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration
            shard: 1
            total: 1
            browsers: chromium
          - suite: mocked
            shard: 1
            total: 2
            browsers: chromium webkit
          - suite: mocked
            shard: 2
            total: 2
            browsers: chromium webkit
    runs-on: ubuntu-24.04
    # 45 分钟：浏览器缓存未命中（lockfile 变更/缓存淘汰）时 Chromium+WebKit
    # 全量下载约 20 分钟起，叠加完整栈启动与双浏览器套件，30 分钟会撞线
    # 被强制取消（2026-10-10 PR#101 首次部署实测）；缓存命中时全程 ~10 分钟
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 准备环境变量（local 环境，演示登录可用）
        if: matrix.suite == 'integration'
        run: cp .env.example .env
      - name: 启动完整栈（db + backend + prestart + frontend）
        if: matrix.suite == 'integration'
        # -f 跳过本地开发的 compose.override.yml（5173 映射），用生产端口形态。
        # 曾叠加 compose.ci-build-cache.yml + buildx 构建器走 type=gha 层缓存，
        # 实测从未生效（up --build 不导出 cache_to：日志 0 条 CACHED、缓存
        # 列表 0 条 buildkit 条目），而冷构建本就只要 ~100 秒，整套拆除。
        run: docker compose -f compose.yml up -d --build
      - name: 等待就绪（prestart 迁移 + backend 健康检查，首次较慢）
        if: matrix.suite == 'integration'
        run: |
          port=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d '"')
          port=${port:-80}
          echo "frontend 端口: $port"
          for i in $(seq 1 150); do
            if curl -fsS "http://localhost:$port/api/v1/utils/ready-check/" > /dev/null 2>&1; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "❌ 栈未就绪，容器状态："
          docker compose -f compose.yml ps
          docker compose -f compose.yml logs backend --tail 30
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # integration（仅 chromium）与 mocked（双浏览器）各存各的 key；冷起的
      # integration 分片不得把只含 chromium 的缓存写进 mocked 用的 key。
      # 精确 key 未命中（lockfile 变更）时前缀兜底到兄弟套件的缓存：
      # mocked（双浏览器）是 integration 的超集可直接复用；mocked 反向命中
      # integration 时也省下 chromium 下载，只补装 webkit。
      # -icu2 前缀：2026-10-23 runner 镜像升级更换 libicu 版本，旧缓存里的
      # WebKit 二进制链接 libicu74 启动即挂（libicudata.so.74 not found），
      # 挪 key 强制冷装重建（key 与 restore 前缀一起挪，避免旧缓存兜底复活）。
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-icu2-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ matrix.suite }}
          restore-keys: |
            playwright-icu2-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: 安装依赖与 Chromium/WebKit
        # 浏览器二进制约百 MB，冷装较慢，超时放宽到 15 分钟
        timeout-minutes: 15
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps ${{ matrix.browsers }}
      # mocked 套件用 vite preview 服务 dist/ 静态产物：按 git 跟踪文件的
      # blob 指纹缓存，前端未变的 PR（纯后端改动/重跑）直接复用、跳过构建。
      # 指纹用 git ls-files -s 而非 hashFiles 白名单：白名单漏列任何影响
      # 构建的文件都会测到过期产物，全量跟踪文件指纹不会。
      - name: 计算前端源码指纹
        if: matrix.suite == 'mocked'
        id: fronthash
        run: echo "hash=$(git ls-files -s frontend | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: 恢复前端构建产物
        if: matrix.suite == 'mocked'
        id: distcache
        uses: actions/cache@v6
        with:
          path: frontend/dist
          key: mocked-dist-${{ runner.os }}-${{ steps.fronthash.outputs.hash }}
      - name: 构建模拟接口测试使用的前端
        if: matrix.suite == 'mocked' && steps.distcache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm run build
      - name: 运行真实后端 E2E（独立数据库，串行）
        if: matrix.suite == 'integration'
        working-directory: frontend
        run: |
          port=$(grep -E '^APP_PORT=' ../.env | cut -d= -f2 | tr -d '"')
          E2E_BASE_URL="http://localhost:${port:-80}" npx playwright test --project=chromium
      - name: 运行模拟接口 E2E（双浏览器，独立分片）
        if: matrix.suite == 'mocked'
        working-directory: frontend
        env:
          E2E_MOCK_ONLY: "true"
        run: npx playwright test --project=chromium-mock --project=webkit --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # Keep the existing required check name; deployment must wait for every shard.
  e2e:
    name: E2E 冒烟（主干道）
    needs: [e2e-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 确认所有 E2E 分片通过
        env:
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: test "$E2E_RESULT" = "success"

  deploy:
    name: 部署到服务器
    needs: [backend, frontend, e2e]
    # PR 只跑检查不部署；push 事件本身已限定 master 分支
    if: vars.ENABLE_PRODUCTION_DEPLOY == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # 同一生产环境互斥；过期提交在服务器持锁阶段跳过，不假设排队顺序。
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # 覆盖 SSH 步骤本身（command_timeout 30m）之外的编排开销
    timeout-minutes: 45
    steps:
      # fetch-depth 0：git bundle 兜底需要完整历史（服务器可能落后多个提交）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 从 Secrets 生成 .env（base64 中转，值不进入 shell 源码）
        id: envfile
        # Secrets 只经 env: 进入进程环境，脚本里按变量名引用；
        # 任何 $、引号、反引号都不会被 shell 解释（对比直接拼进脚本文本的写法）
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          COMPOSE_PROJECT_NAME: ${{ secrets.COMPOSE_PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_PORT: ${{ secrets.APP_PORT }}
          WORKERS: ${{ secrets.WORKERS || '1' }}
          # 未设 Secret 时为空串，generate-deploy-env.sh 会落默认值 8
          SCORING_WORKERS: ${{ secrets.SCORING_WORKERS }}
          # 未设 Secret 时为空串，generate-deploy-env.sh 会落默认值 0（不清理）
          AUDIO_TTL_DAYS: ${{ secrets.AUDIO_TTL_DAYS }}
          COST_ALERT_EMAIL: ${{ secrets.COST_ALERT_EMAIL }}
          USERS_OPEN_REGISTRATION: ${{ secrets.USERS_OPEN_REGISTRATION || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL || 'info@example.com' }}
          SMTP_TLS: ${{ secrets.SMTP_TLS || 'True' }}
          SMTP_SSL: ${{ secrets.SMTP_SSL || 'False' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          # 可选 Secrets：不设置时为空，默认值统一由 generate-deploy-env.sh 落
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SCORING_PROVIDER: ${{ secrets.SCORING_PROVIDER }}
          ASR_PROVIDER: ${{ secrets.ASR_PROVIDER }}
          VOLC_ASR_API_KEY: ${{ secrets.VOLC_ASR_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_ASR_MODEL: ${{ secrets.ARK_ASR_MODEL }}
          ARK_RUBRIC_MODEL: ${{ secrets.ARK_RUBRIC_MODEL }}
          ARK_TTS_API_KEY: ${{ secrets.ARK_TTS_API_KEY }}
          ARK_TTS_MODEL: ${{ secrets.ARK_TTS_MODEL }}
          ARK_TTS_VOICE: ${{ secrets.ARK_TTS_VOICE }}
          DP_Id: ${{ secrets.DP_Id }}
          DP_Key: ${{ secrets.DP_Key }}
          TLS_DOMAIN: ${{ secrets.TLS_DOMAIN }}
        run: |
          bash scripts/generate-deploy-env.sh "$RUNNER_TEMP/deploy.env"
          env_b64=$(base64 < "$RUNNER_TEMP/deploy.env" | tr -d '\n')
          echo "::add-mask::$env_b64"
          echo "env_b64=$env_b64" >> "$GITHUB_OUTPUT"
          echo "path_b64=$(printf '%s' "$DEPLOY_PATH" | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/deploy.env"

      - name: 打包本次提交为 git bundle（服务器镜像失联时的拉取兜底）
        # 服务器 origin 走 gh-proxy.com 镜像，2026-10-20 起对匿名访问持续 401；
        # runner 在境外直连 GitHub 稳定——把本次提交打成 bundle 传过去，
        # 服务器 git fetch 本地文件即可推进到目标提交，不再依赖任何镜像
        run: |
          git bundle create deploy.bundle HEAD
          git bundle verify deploy.bundle

      - name: 传送 bundle 到服务器
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy.bundle
          target: /tmp/esa-deploy

      - name: 服务器拉代码并重启服务
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_B64: ${{ steps.envfile.outputs.env_b64 }}
          PATH_B64: ${{ steps.envfile.outputs.path_b64 }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: ENV_B64,PATH_B64,DEPLOY_SHA
          script: |
            set -e
            umask 077
            deploy_path=$(printf '%s' "$PATH_B64" | base64 -d)
            cd "$deploy_path"
            trap 'rm -f .env.new' EXIT

            echo "=== 1/7 checkout 到本次 CI 验证过的提交 ==="
            # 不用 git pull：pull 拿到的是"部署时刻的最新 master"，连续 push 时可能部署到还没过 CI 的提交。
            # reset --hard 到 github.sha 保证部署的永远是这个 run 测过的代码，也兼容紧急回滚后的服务器状态。
            # 服务器 origin 走 gh-proxy.com 镜像：偶发 403/429 退避重试；持续 401（2026-10-20 起
            # 匿名访问被关）则回退到 CI 传入的 git bundle——部署链不再依赖镜像可用性。
            fetch_ok=0
            for attempt in 1 2 3; do
              if git fetch origin; then fetch_ok=1; break; fi
              echo "git fetch 失败（第 ${attempt} 次），$((attempt * 30)) 秒后重试"
              sleep $((attempt * 30))
            done
            if [ "$fetch_ok" = "1" ]; then
              if [ "$DEPLOY_SHA" != "$(git rev-parse origin/master)" ]; then
                echo "Skipping superseded commit; deploy the current master through its own CI run."
                exit 0
              fi
              git reset --hard "$DEPLOY_SHA"
            else
              echo "origin 镜像失联，改用 CI 传入的 bundle 拉取本次提交"
              git fetch /tmp/esa-deploy/deploy.bundle HEAD
              if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
                echo "❌ bundle 内容与本次 CI 提交不一致，中止部署"
                exit 1
              fi
              # bundle 只含本次 CI 的提交：跳过 superseded 检查（无法向 origin 求证更新提交，
              # 但 concurrency 组串行化部署，乱序窗口内旧 run 部署后新 run 会再推进）
              git reset --hard FETCH_HEAD
            fi
            rm -f /tmp/esa-deploy/deploy.bundle

            echo "=== 2/7 解码 .env 并校验 ==="
            printf '%s' "$ENV_B64" | base64 -d > .env.new
            chmod 600 .env.new
            # 必填键非空白（生成的每行都是 KEY="value" 形式，值非空即引号间有内容）
            for k in FRONTEND_HOST SECRET_KEY FIRST_SUPERUSER FIRST_SUPERUSER_PASSWORD POSTGRES_PASSWORD APP_PORT; do
              if ! grep -Eq "^${k}=\".+\"" .env.new; then
                echo "❌ .env 校验失败：$k 缺失或为空白"
                exit 1
              fi
            done
            # 这份配置必须能被 compose 完整解析（含 ${VAR?} 必填检查与插值合法性）
            if ! COMPOSE_ENV_FILE=.env.new docker compose -f compose.yml --env-file .env.new config --quiet; then
              echo "❌ .env.new 无法通过 docker compose 校验，保留现有 .env 不变"
              exit 1
            fi

            echo "=== 3/7 原子替换 .env ==="
            # 校验全部通过才替换（同文件系统 rename，不存在写一半的 .env）
            mv .env.new .env

            echo "=== 4/7 HTTPS 证书（配置 DP_Id/DP_Key/TLS_DOMAIN 时自动签发，幂等） ==="
            if grep -Eq '^DP_Id=".+"' .env && grep -Eq '^DP_Key=".+"' .env && grep -Eq '^TLS_DOMAIN=".+"' .env; then
              tls_domain=$(sed -n 's/^TLS_DOMAIN="\([^"]*\)"$/\1/p' .env)
              mkdir -p ssl
              # 目录可能由 docker（root）在首次挂载时创建，部署用户无权 chmod；属主 root 更安全，不视为失败
              chmod 700 ssl 2>/dev/null || true
              if [ ! -f ssl/fullchain.pem ]; then
                echo "首次签发 $tls_domain 证书（Let's Encrypt DNS-01，无需停机）"
                docker compose -f compose.yml run --rm acme --issue --dns dns_dp -d "$tls_domain" --server letsencrypt --keylength ec-256
                docker compose -f compose.yml run --rm acme --install-cert -d "$tls_domain" --fullchain-file /ssl/fullchain.pem --key-file /ssl/privkey.pem
                echo "证书已安装到 ./ssl/，nginx 将以 https 启动"
                # 本次部署新出现了证书：现有容器的 entrypoint 已按无证书形态
                # 启动过，后面需要强制重建一次 frontend 让它重新求值 TLS
                tls_first_issue=1
              else
                echo "证书已存在，跳过签发（acme daemon 自动续期）"
              fi
              # 每日 04:00 平滑重载 nginx：夜间续期出的新证书最迟一天内加载（reload 无感幂等）
              reload_cmd="cd '$PWD' && docker compose -f compose.yml exec -T frontend nginx -s reload"
              (crontab -l 2>/dev/null | grep -v 'nginx -s reload'; echo "0 4 * * * $reload_cmd") | crontab -
            else
              echo "未配置 DNSPod 密钥/域名，保持纯 HTTP（本地与首启兼容）"
            fi

            echo "=== 5/7 每日数据库备份（幂等注册，保留 14 天） ==="
            mkdir -p backups
            chmod 700 backups
            # 完整备份包含数据库、录音/标准音卷和部署配置；失败记入巡检日志。
            # 清理旧版 cron，避免迁移后重复运行。部署前的数据库快照仍单独保留。
            backup_cmd="cd '$PWD' && bash scripts/backup-local.sh || date >> '$PWD/backups/backup-failure.log'"
            (crontab -l 2>/dev/null | grep -v -e 'app-.*sql.gz' -e 'scripts/backup-local.sh'; echo "30 3 * * * $backup_cmd") | crontab -
            # 部署时顺手做一次当次备份，保证改库前总有快照；失败则中止部署（不能无快照改库）
            dump_tmp="backups/app-$(date +%Y%m%d-%H%M)-predeploy.sql"
            if docker compose -f compose.yml exec -T db sh -c 'pg_dump -U ${POSTGRES_USER} ${POSTGRES_DB}' > "$dump_tmp"; then
              gzip -f "$dump_tmp"
              echo "predeploy 快照完成：${dump_tmp}.gz"
            else
              rm -f "$dump_tmp"
              echo "❌ predeploy 备份失败，中止部署（数据库快照拿不到，不应带着风险改库）"
              exit 1
            fi

            echo "=== 6/7 构建并重启容器 ==="
            # 先把当前 :latest 打成 :rollback：up --build 之后旧镜像若无任何
            # 标签即成悬空、会被下面的 prune 清掉。保留上一版供紧急回退
            # （bash scripts/rollback.sh，秒级、不重新构建）；带标签的镜像
            # 不属于悬空镜像，prune 清不掉它。首次部署（无 latest）自然跳过。
            for img in esa-backend esa-frontend; do
              if docker image inspect "$img:latest" >/dev/null 2>&1; then
                docker tag "$img:latest" "$img:rollback"
                echo "$img:rollback 已指向上一版"
              fi
            done
            docker compose -f compose.yml up -d --build --remove-orphans || {
              echo "--- prestart logs ---"
              docker compose -f compose.yml logs prestart --tail 50
              echo "--- backend logs ---"
              docker compose -f compose.yml logs backend --tail 50
              exit 1
            }
            # frontend 的 TLS 形态由 entrypoint 在容器启动时决定：只有本次部署
            # 首次签发了证书才需要强制重建（compose up 不会因磁盘上多了证书而
            # 重建容器）。例行部署不再强重建——消除每次部署 1~2 秒的前端闪断；
            # 证书续期由每日 04:00 的 nginx reload cron 覆盖（reload 即加载新证书）。
            if [ "${tls_first_issue:-0}" = "1" ]; then
              docker compose -f compose.yml up -d --force-recreate --no-deps frontend
            fi

            echo "=== 7/7 验证（就绪检查 = 含数据库可用性；经 nginx 反代访问）==="
            app_port=$(sed -n 's/^APP_PORT="\([0-9]*\)"$/\1/p' .env)
            healthy=""
            for i in $(seq 1 30); do
              if curl --connect-timeout 2 --max-time 5 -fsS "http://localhost:$app_port/api/v1/utils/ready-check/" > /dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "❌ 就绪检查重试 30 次后仍未通过"
              docker compose -f compose.yml ps
              docker compose -f compose.yml logs backend --tail 50
              exit 1
            fi
            echo "✅ 部署成功"
            docker compose -f compose.yml ps

            echo "=== 清理旧镜像与超额构建缓存，防止磁盘被占满 ==="
            docker image prune -f
            # 构建缓存每次部署累积且无上限；保留最近 20G，超出按最旧淘汰
            # （118G 盘，试点期足够）。失败不阻断部署——清理只是容量兜底。
            docker builder prune -f --keep-storage 20g || true
