# =============================================================================
# 生产部署独立流水线（手动触发）
#
# 与 deploy.yml（纯 CI）拆分后：
#   - deploy.yml 只跑检查（PR / push master / 手动重跑），不再触碰生产；
#   - 本文件只由 workflow_dispatch 手动触发，输入 ref（master / 40 位 SHA / tag），
#     解析成确定 SHA → 校验该 SHA 在 master 历史内且已有成功 CI → checkout → 部署。
#
# 评审要点（对应部署闸门方案第 3 节）：
#   1. ref 安全 checkout：先在 resolve 步骤把 ref 解析成确定 SHA，
#      checkout 与服务器 DEPLOY_SHA 都用这个 SHA，不用 github.sha、不 pull 最新；
#   2. environment 挂在 deploy job 上（与现状一致，环境级 Secrets 优先）；
#   3. concurrency 保留 production-deploy 组，cancel-in-progress: false；
#   4. 对 CI 成功的依赖：跨 workflow 不能 needs，用 pre-flight 步骤查
#      deploy.yml 在该 SHA 上的成功运行记录来表达。
#
# 下方部署步骤（envfile / serverhead / bundle / scp / ssh 部署 / RLS 自检）
# 从原 deploy.yml 的 deploy job 逐字搬迁，仅替换触发方式、SHA 来源与 CI 依赖表达。
# =============================================================================

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要上线的提交 SHA、tag 或 master（默认 master 最新；建议填完整 40 位 SHA）"
        required: false
        default: "master"

# 最小权限：读仓库内容 + 读 Actions 运行记录（pre-flight 校验 CI 是否成功）
permissions:
  contents: read
  actions: read

# 与原 deploy job 同一把生产互斥锁；不自动取消进行中的部署
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 手动部署到生产
    # 跨 workflow 无法 needs 原 CI job；CI 成功依赖由下方「校验 CI 记录」步骤显式表达。
    # environment 放在部署 job 上：环境级 Secrets 优先于仓库级，审批（若配置）也挂在这里。
    environment:
      name: production
    runs-on: ubuntu-24.04
    # 覆盖 SSH 步骤本身（command_timeout 50m）之外的编排开销；
    # 服务器冷构建（腾讯镜像直连）15–20 分钟量级，60 分钟留足余量
    timeout-minutes: 60
    steps:
      - name: 解析 ref 为确定 SHA（校验输入合法且在 master 历史内）
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ inputs.ref || 'master' }}"
          # 只接受 master、40 位 commit SHA、安全字符 tag 名；拒绝任意分支名/ref 表达式
          if ! printf '%s' "$ref" | grep -Eq '^(master|[0-9a-fA-F]{40}|[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)$'; then
            echo "❌ 不允许的 ref：$ref（只接受 master、40 位 commit SHA 或 tag 名）"
            exit 1
          fi
          sha=$(gh api "repos/${{ github.repository }}/commits/${ref}" --jq .sha)
          # 该提交必须落在 master 历史内（identical/behind）；分叉或领先 master 的提交拒绝部署
          status=$(gh api "repos/${{ github.repository }}/compare/master...${sha}" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "❌ $ref（$sha）不在 master 历史内（compare=$status），拒绝部署"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "输入 ref: $ref → 解析为 $sha（master 历史内，compare=$status）"

      - name: 校验该 SHA 已有成功的 CI 运行（替代原 deploy job 的 needs）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ steps.resolve.outputs.sha }}"
          run_id=$(gh run list \
            --workflow=deploy.yml \
            --commit="$sha" \
            --status=success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "❌ $sha 在 deploy.yml 中没有成功的 CI 记录，拒绝部署。"
            echo "   请先在 master 上等待 CI 全绿；若目标提交仅含文档类变更，"
            echo "   生产代码与上一版一致，无需重新部署。"
            exit 1
          fi
          echo "✅ $sha 已有成功 CI 运行 #$run_id"

      # fetch-depth 0：git bundle 兜底需要完整历史（服务器可能落后多个提交）
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: 从 Secrets 生成 .env（base64 中转，值不进入 shell 源码）
        id: envfile
        # Secrets 只经 env: 进入进程环境，脚本里按变量名引用；
        # 任何 $、引号、反引号都不会被 shell 解释（对比直接拼进脚本文本的写法）
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          COMPOSE_PROJECT_NAME: ${{ secrets.COMPOSE_PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # 多租户 C4b：受限/平台角色凭据（配齐即激活 RLS；未设为空串=回落 owner）
          APP_POSTGRES_USER: ${{ secrets.APP_POSTGRES_USER }}
          APP_POSTGRES_PASSWORD: ${{ secrets.APP_POSTGRES_PASSWORD }}
          PLATFORM_POSTGRES_USER: ${{ secrets.PLATFORM_POSTGRES_USER }}
          PLATFORM_POSTGRES_PASSWORD: ${{ secrets.PLATFORM_POSTGRES_PASSWORD }}
          APP_PORT: ${{ secrets.APP_PORT }}
          WORKERS: ${{ secrets.WORKERS || '1' }}
          # 未设 Secret 时为空串，generate-deploy-env.sh 会落默认值 8
          SCORING_WORKERS: ${{ secrets.SCORING_WORKERS }}
          # 未设 Secret 时为空串，generate-deploy-env.sh 会落默认值 0（不清理）
          AUDIO_TTL_DAYS: ${{ secrets.AUDIO_TTL_DAYS }}
          # 未设 Secret 时为空串，脚本落 /app/export 与 7 天
          EXPORT_STORAGE_DIR: ${{ secrets.EXPORT_STORAGE_DIR }}
          EXPORT_TTL_DAYS: ${{ secrets.EXPORT_TTL_DAYS }}
          COST_ALERT_EMAIL: ${{ secrets.COST_ALERT_EMAIL }}
          # 前端 Sentry 错误上报（构建期注入）：链路 compose→Dockerfile→vite 已就绪，
          # Secret 留空 = 不打包 Sentry（现状行为不变）
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # 公开站点「联系我们」邮箱（构建期注入）：留空则页面只提示联系学校平台管理员
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
          USERS_OPEN_REGISTRATION: ${{ secrets.USERS_OPEN_REGISTRATION || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL || 'info@example.com' }}
          SMTP_TLS: ${{ secrets.SMTP_TLS || 'True' }}
          SMTP_SSL: ${{ secrets.SMTP_SSL || 'False' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          # 可选 Secrets：不设置时为空，默认值统一由 generate-deploy-env.sh 落
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SCORING_PROVIDER: ${{ secrets.SCORING_PROVIDER }}
          ASR_PROVIDER: ${{ secrets.ASR_PROVIDER }}
          VOLC_ASR_API_KEY: ${{ secrets.VOLC_ASR_API_KEY }}
          VOLC_ASR_RESOURCE_ID: ${{ secrets.VOLC_ASR_RESOURCE_ID }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_ASR_MODEL: ${{ secrets.ARK_ASR_MODEL }}
          ARK_RUBRIC_MODEL: ${{ secrets.ARK_RUBRIC_MODEL }}
          ARK_TTS_API_KEY: ${{ secrets.ARK_TTS_API_KEY }}
          ARK_TTS_MODEL: ${{ secrets.ARK_TTS_MODEL }}
          ARK_TTS_VOICE: ${{ secrets.ARK_TTS_VOICE }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          VOLC_TTS_API_KEY: ${{ secrets.VOLC_TTS_API_KEY }}
          VOLC_TTS_RESOURCE_ID: ${{ secrets.VOLC_TTS_RESOURCE_ID }}
          VOLC_TTS_VOICE: ${{ secrets.VOLC_TTS_VOICE }}
          DP_Id: ${{ secrets.DP_Id }}
          DP_Key: ${{ secrets.DP_Key }}
          TLS_DOMAIN: ${{ secrets.TLS_DOMAIN }}
          LEGACY_DOMAIN: ${{ secrets.LEGACY_DOMAIN }}
          PRIMARY_DOMAIN: ${{ secrets.PRIMARY_DOMAIN }}
        run: |
          bash scripts/generate-deploy-env.sh "$RUNNER_TEMP/deploy.env"
          env_b64=$(base64 < "$RUNNER_TEMP/deploy.env" | tr -d '\n')
          echo "::add-mask::$env_b64"
          echo "env_b64=$env_b64" >> "$GITHUB_OUTPUT"
          echo "path_b64=$(printf '%s' "$DEPLOY_PATH" | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/deploy.env"

      - name: 探测服务器提交与拉取能力（bundle 仅在拉取失败时传输）
        # 两件事：①问服务器现在在哪（增量 bundle 的打包基线）；②让服务器先
        # 经 gh-proxy 自行 git fetch 一次（国内下行，秒级）。预检成功则本次
        # 部署完全跳过 bundle 跨境 scp——2026-10-29 实测全量 3.1MB 在
        # ~4KB/s 跨境 SSH 上要传 13 分钟，且探测曾持续返回 none（增量从未
        # 生效），每次都在付全量税。拉取失败时仍传全量 bundle 兜底，不降级。
        id: serverhead
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          umask 077
          printf '%s' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/deploy_id"
          # OpenSSH 要求私钥文件以换行结尾；GitHub Secrets 里的 key 常缺尾换行，
          # 直接 printf '%s' 写出的文件会被原生 ssh 拒绝（Go 实现的 ssh-action 容忍）。
          # 这解释了两件事长期不一致：原生 ssh 探测长期返回 none，而 appleboy 部署一直成功。
          if [ -n "$(tail -c 1 "$RUNNER_TEMP/deploy_id")" ]; then printf '\n' >> "$RUNNER_TEMP/deploy_id"; fi
          chmod 600 "$RUNNER_TEMP/deploy_id"
          # 连接参数统一：身份固定、禁交互（防 askpass 挂死）、30s 握手窗口
          ssh_opts=(-i "$RUNNER_TEMP/deploy_id" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          # 2026-11-04/05 实测：探测 1.7s 即返回 none，失败在建立连接阶段而非超时；
          # 失败时打出 stderr（脱敏）留作归因证据，不再 2>/dev/null 全吞。
          if ! sha=$(ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" \
              "cd '$DEPLOY_PATH' 2>/dev/null && git rev-parse HEAD 2>/dev/null || echo none" 2>"$RUNNER_TEMP/probe_err"); then
            sha=none
            echo "::warning::ssh 探测失败（秒级失败，非超时），stderr 如下"
            sed -E 's/(AAAA[A-Za-z0-9+\/=]{16,})/***/g' "$RUNNER_TEMP/probe_err" | tail -12
          fi
          # 调试留痕：探测曾连续返回空/none（增量从未生效）；sha 为十六进制无敏感
          echo "probe raw output: [$sha]"
          echo "deploy path bytes: $(printf '%s' "$DEPLOY_PATH" | wc -c)"
          case "$sha" in ''|*[^0-9a-f]*|*[A-F]*|*' '*) sha=none;; esac
          # 拉取预检 ×3 重试：gh-proxy 抖动（403/429 瞬时）是常态，单次判定太脆。
          fetch=fail
          for attempt in 1 2 3; do
            if ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" \
                "cd '$DEPLOY_PATH' 2>/dev/null && timeout 90 git fetch origin" 2>"$RUNNER_TEMP/fetch_err"; then
              fetch=ok
              break
            fi
            echo "拉取预检失败（第 ${attempt} 次），stderr:"
            sed -E 's/(AAAA[A-Za-z0-9+\/=]{16,})/***/g' "$RUNNER_TEMP/fetch_err" | tail -6
            sleep 10
          done
          rm -f "$RUNNER_TEMP/deploy_id"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "fetch=$fetch" >> "$GITHUB_OUTPUT"
          echo "服务器当前提交: $sha；拉取预检: $fetch（bundle $([ "$fetch" = ok ] && echo 跳过传输 || echo 需要传输)）"

      - name: 打包增量 git bundle（服务器镜像失联时的拉取兜底）
        # 服务器 origin 走 gh-proxy.com 镜像，偶发 403/429/401；runner 在境外
        # 直连 GitHub 稳定——把目标提交打进 bundle 传过去，服务器 fetch 本地
        # 文件即可推进到目标，不再依赖镜像可用性。
        run: |
          target=$(git rev-parse HEAD)
          server_sha="${{ steps.serverhead.outputs.sha }}"
          base=""
          if [ "$server_sha" != "none" ] && git cat-file -e "$server_sha^{commit}" 2>/dev/null; then
            base=$(git merge-base "$target" "$server_sha" || true)
          fi
          # 重跑同一提交的部署时 merge-base == 目标：退一格避免打出空 bundle。
          # ref 必须用 HEAD（不能用裸 SHA）：bundle 内的 ref 名会变成 SHA 本身，
          # 服务器脚本 fetch 的是 HEAD，对不上会找不到远端 ref
          [ "$base" = "$target" ] && base=$(git rev-parse HEAD~1)
          if [ -n "$base" ]; then
            git bundle create deploy.bundle HEAD "^$base"
          else
            echo "服务器历史不可比对（$server_sha），降级全量 bundle"
            git bundle create deploy.bundle HEAD
          fi
          git bundle verify deploy.bundle
          du -h deploy.bundle

      - name: 传送 bundle 到服务器（仅拉取预检失败时）
        # 拉取预检成功 = 服务器能自己拿到提交，跨境 scp（全量 3.1MB ≈ 13 分钟）
        # 完全跳过；预检失败（gh-proxy 故障）才传兜底。极端窗口（预检成功但
        # 部署时拉取又失败）会因缺 bundle 文件显式失败，重跑即恢复。
        if: steps.serverhead.outputs.fetch == 'fail'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy.bundle
          target: /tmp/esa-deploy

      - name: 服务器拉代码并重启服务
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_B64: ${{ steps.envfile.outputs.env_b64 }}
          PATH_B64: ${{ steps.envfile.outputs.path_b64 }}
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 50m
          envs: ENV_B64,PATH_B64,DEPLOY_SHA
          script: |
            set -e
            umask 077
            deploy_path=$(printf '%s' "$PATH_B64" | base64 -d)
            cd "$deploy_path"
            trap 'rm -f .env.new' EXIT

            echo "=== 1/7 checkout 到本次 CI 验证过的提交 ==="
            # 不用 git pull：pull 拿到的是"部署时刻的最新 master"，连续 push 时可能部署到还没过 CI 的提交。
            # reset --hard 到 DEPLOY_SHA（dispatch 解析出的确定 SHA）保证部署的永远是已过 CI 的代码，也兼容紧急回滚后的服务器状态。
            # 服务器 origin 走 gh-proxy.com 镜像：偶发 403/429 退避重试；持续 401（2026-10-20 起
            # 匿名访问被关）则回退到 CI 传入的 git bundle——部署链不再依赖镜像可用性。
            fetch_ok=0
            for attempt in 1 2 3; do
              # 单次 fetch 限时：gh-proxy 偶发挂死时，无超时的 TCP 连接会静默吃掉部署预算
              if timeout 90 git fetch origin; then fetch_ok=1; break; fi
              echo "git fetch 失败（第 ${attempt} 次），$((attempt * 30)) 秒后重试"
              sleep $((attempt * 30))
            done
            if [ "$fetch_ok" = "1" ]; then
              if [ "$DEPLOY_SHA" != "$(git rev-parse origin/master)" ]; then
                # 领先提交若含代码：让位给会自己部署的新 run，避免旧代码盖掉可能已执行的新迁移。
                # 领先提交若全是被 paths-ignore 的路径（纯文档等），它们不会触发自己的
                # CI——照常部署本次验证过的代码，否则生产会卡在旧提交
                # （2026-10-30 实测：代码 PR 部署被 docs 提交"取代"后无人部署）。
                # 路径清单须与 on.push.paths-ignore 保持一致；用计数对比而非
                # grep -q -v（该组合在部分 grep 实现下语义不可靠）。
                changed=$(git diff --name-only "$DEPLOY_SHA" origin/master)
                total=$(printf '%s\n' "$changed" | grep -c . || true)
                ignored=$(printf '%s\n' "$changed" | grep -cE '^docs/|^reviews/|^prototypes/|^gui-test-screenshots/|\.md$' || true)
                if [ "${total:-0}" -gt "${ignored:-0}" ]; then
                  echo "Skipping superseded commit; deploy the current master through its own CI run."
                  exit 0
                fi
                echo "领先提交均为文档类（不触发部署的路径），照常部署本次验证过的代码"
              fi
              git reset --hard "$DEPLOY_SHA"
            else
              echo "origin 镜像失联，改用 CI 传入的 bundle 拉取本次提交"
              git fetch /tmp/esa-deploy/deploy.bundle HEAD
              if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
                echo "❌ bundle 内容与本次 CI 提交不一致，中止部署"
                exit 1
              fi
              # bundle 只含本次 CI 的提交：跳过 superseded 检查（无法向 origin 求证更新提交，
              # 但 concurrency 组串行化部署，乱序窗口内旧 run 部署后新 run 会再推进）
              git reset --hard FETCH_HEAD
            fi
            rm -f /tmp/esa-deploy/deploy.bundle

            echo "=== 2/7 解码 .env 并校验 ==="
            printf '%s' "$ENV_B64" | base64 -d > .env.new
            chmod 600 .env.new
            # 必填键非空白（生成的每行都是 KEY="value" 形式，值非空即引号间有内容）
            for k in FRONTEND_HOST SECRET_KEY FIRST_SUPERUSER FIRST_SUPERUSER_PASSWORD POSTGRES_PASSWORD APP_PORT; do
              if ! grep -Eq "^${k}=\".+\"" .env.new; then
                echo "❌ .env 校验失败：$k 缺失或为空白"
                exit 1
              fi
            done
            # 这份配置必须能被 compose 完整解析（含 ${VAR?} 必填检查与插值合法性）
            if ! COMPOSE_ENV_FILE=.env.new docker compose -f compose.yml --env-file .env.new config --quiet; then
              echo "❌ .env.new 无法通过 docker compose 校验，保留现有 .env 不变"
              exit 1
            fi

            echo "=== 3/7 原子替换 .env ==="
            # 校验全部通过才替换（同文件系统 rename，不存在写一半的 .env）
            mv .env.new .env

            echo "=== 4/7 HTTPS 证书（配置 DP_Id/DP_Key/TLS_DOMAIN 时自动签发，幂等） ==="
            if grep -Eq '^DP_Id=".+"' .env && grep -Eq '^DP_Key=".+"' .env && grep -Eq '^TLS_DOMAIN=".+"' .env; then
              tls_domain=$(sed -n 's/^TLS_DOMAIN="\([^"]*\)"$/\1/p' .env)
              mkdir -p ssl
              # 目录可能由 docker（root）在首次挂载时创建，部署用户无权 chmod；属主 root 更安全，不视为失败
              chmod 700 ssl 2>/dev/null || true
              if [ ! -f ssl/fullchain.pem ]; then
                echo "首次签发 $tls_domain 证书（Let's Encrypt DNS-01，无需停机）"
                docker compose -f compose.yml run --rm acme --issue --dns dns_dp -d "$tls_domain" --server letsencrypt --keylength ec-256
                docker compose -f compose.yml run --rm acme --install-cert -d "$tls_domain" --fullchain-file /ssl/fullchain.pem --key-file /ssl/privkey.pem
                echo "证书已安装到 ./ssl/，nginx 将以 https 启动"
                # 本次部署新出现了证书：现有容器的 entrypoint 已按无证书形态
                # 启动过，后面需要强制重建一次 frontend 让它重新求值 TLS
                tls_first_issue=1
              else
                echo "证书已存在，跳过签发（acme daemon 自动续期）"
              fi
              # 每日 04:00 平滑重载 nginx：夜间续期出的新证书最迟一天内加载（reload 无感幂等）
              # 注册写法说明：crontab 为空时 `crontab -l` 退出码 1 会被 set -e 放大成
              # 「注册子 shell 在 echo 前被掐死 + crontab - 收到空输入反而清空任务表」的
              # 自抹除死锁——每日备份与证书重载曾因此从未生效（2026-10-29 定位）。
              # 稳妥写法：先落到临时文件再整体写入，任何 crontab 初始状态都不致命。
              reload_cmd="cd '$PWD' && docker compose -f compose.yml exec -T frontend nginx -s reload"
              { crontab -l 2>/dev/null || true; } | grep -v 'nginx -s reload' > /tmp/cron-register.new || true
              echo "0 4 * * * $reload_cmd" >> /tmp/cron-register.new
              crontab /tmp/cron-register.new && rm -f /tmp/cron-register.new
            else
              echo "未配置 DNSPod 密钥/域名，保持纯 HTTP（本地与首启兼容）"
            fi

            echo "=== 5/7 每日数据库备份（幂等注册，保留 14 天） ==="
            mkdir -p backups
            chmod 700 backups
            # 完整备份包含数据库、录音/标准音卷和部署配置；失败记入巡检日志。
            # 清理旧版 cron，避免迁移后重复运行。部署前的数据库快照仍单独保留。
            backup_cmd="cd '$PWD' && bash scripts/backup-local.sh || date >> '$PWD/backups/backup-failure.log'"
            { crontab -l 2>/dev/null || true; } | grep -v -e 'app-.*sql.gz' -e 'scripts/backup-local.sh' > /tmp/cron-register.new || true
            echo "30 3 * * * $backup_cmd" >> /tmp/cron-register.new
            crontab /tmp/cron-register.new && rm -f /tmp/cron-register.new
            # 部署时顺手做一次当次备份，保证改库前总有快照；失败则中止部署（不能无快照改库）
            dump_tmp="backups/app-$(date +%Y%m%d-%H%M)-predeploy.sql"
            if docker compose -f compose.yml exec -T db sh -c 'pg_dump -U ${POSTGRES_USER} ${POSTGRES_DB}' > "$dump_tmp"; then
              gzip -f "$dump_tmp"
              echo "predeploy 快照完成：${dump_tmp}.gz"
            else
              rm -f "$dump_tmp"
              echo "❌ predeploy 备份失败，中止部署（数据库快照拿不到，不应带着风险改库）"
              exit 1
            fi

            echo "=== 6/7 构建并重启容器 ==="
            # 先把当前 :latest 打成 :rollback：up --build 之后旧镜像若无任何
            # 标签即成悬空、会被下面的 prune 清掉。保留上一版供紧急回退
            # （bash scripts/rollback.sh，秒级、不重新构建）；带标签的镜像
            # 不属于悬空镜像，prune 清不掉它。首次部署（无 latest）自然跳过。
            for img in esa-backend esa-frontend; do
              if docker image inspect "$img:latest" >/dev/null 2>&1; then
                docker tag "$img:latest" "$img:rollback"
                echo "$img:rollback 已指向上一版"
              fi
            done
            docker compose -f compose.yml up -d --build --remove-orphans || {
              echo "--- prestart logs ---"
              docker compose -f compose.yml logs prestart --tail 50
              echo "--- backend logs ---"
              docker compose -f compose.yml logs backend --tail 50
              exit 1
            }
            # frontend 的 TLS 形态由 entrypoint 在容器启动时决定：只有本次部署
            # 首次签发了证书才需要强制重建（compose up 不会因磁盘上多了证书而
            # 重建容器）。例行部署不再强重建——消除每次部署 1~2 秒的前端闪断；
            # 证书续期由每日 04:00 的 nginx reload cron 覆盖（reload 即加载新证书）。
            if [ "${tls_first_issue:-0}" = "1" ]; then
              docker compose -f compose.yml up -d --force-recreate --no-deps frontend
            fi

            echo "=== 7/7 验证（就绪检查 = 含数据库可用性；经 nginx 反代访问）==="
            app_port=$(sed -n 's/^APP_PORT="\([0-9]*\)"$/\1/p' .env)
            healthy=""
            for i in $(seq 1 30); do
              if curl --connect-timeout 2 --max-time 5 -fsS "http://localhost:$app_port/api/v1/utils/ready-check/" > /dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "❌ 就绪检查重试 30 次后仍未通过"
              docker compose -f compose.yml ps
              docker compose -f compose.yml logs backend --tail 50
              exit 1
            fi
            echo "✅ 部署成功"
            docker compose -f compose.yml ps

            echo "=== 清理旧镜像与超额构建缓存，防止磁盘被占满 ==="
            docker image prune -f
            # 构建缓存每次部署累积且无上限；保留最近 20G，超出按最旧淘汰
            # （118G 盘，试点期足够）。失败不阻断部署——清理只是容量兜底。
            docker builder prune -f --keep-storage 20g || true
            # 一次性回收旧命名镜像：esa-* 显式命名上线前的 <project>-<service>:latest
            # 带着旧 tag 不算悬空镜像，prune 清不掉；容器已全部由 esa-* 镜像接管，
            # 首次执行后镜像即不存在，此后本行为无害空转。
            proj=$(sed -n 's/^COMPOSE_PROJECT_NAME="\([^"]*\)"$/\1/p' .env)
            if [ -n "$proj" ]; then
              docker rmi "${proj}-backend:latest" "${proj}-frontend:latest" \
                         "${proj}-prestart:latest" >/dev/null 2>&1 || true
            fi

      # 生产 RLS 自检：把「受限角色是否真在限」变成每次部署都自动产生的证据，
      # 不依赖谁去登录主机手工查。判据见 scripts/prod-rls-selfcheck.sh 头部注释；
      # 失败会让 job 红灯（此时容器已起来，红灯只表示隔离状态不符预期，不是部署失败）。
      - name: 生产 RLS 自检（受限角色真实生效）
        uses: appleboy/ssh-action@v1.2.5
        env:
          PATH_B64: ${{ steps.envfile.outputs.path_b64 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: PATH_B64
          script: |
            set -e
            deploy_path=$(printf '%s' "$PATH_B64" | base64 -d)
            cd "$deploy_path"
            bash scripts/prod-rls-selfcheck.sh
