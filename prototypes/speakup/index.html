iv></section></div><aside class="dashboard-aside"><section class="card goal-card"><div class="between"><h2>这周，稳稳前进</h2><button class="text-btn" data-action="goal" aria-label="调整每周练习目标">${icon('settings')}</button></div><div class="ring-wrap"><svg class="goal-ring" viewBox="0 0 150 150" aria-label="本周已练习4天"><circle cx="75" cy="75" r="62" fill="none" stroke="#eff2e9" stroke-width="10"/><circle cx="75" cy="75" r="62" fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${Math.min(4/state.goal,1)*389.6} 389.6"/></svg><div class="ring-value"><strong>4 <span>/ ${state.goal} 天</span></strong><small>本周开口目标</small></div></div><div class="week">${['一','二','三','四','五','六','日'].map((d,i)=>`<div><div class="day-label">${d}</div><div class="day-check ${i<4?'done':i===5?'today':''}">${i<4?'✓':i===5?'今':'·'}</div></div>`).join('')}</div><p class="goal-note">${state.goal>4?`再练 ${state.goal-4} 天，就完成本周小目标`:'本周目标已达成，保持自己的节奏'}</p></section><section class="card growth-mini"><div class="between mb16"><h2>你的表达，正在生长</h2>${icon('leaf')}</div><div class="between"><div><div class="big-band">B1<span style="font-size:15px;margin-left:7px">自在表达</span></div><p class="small muted" style="font-size:10px;margin-top:6px">当前练习档位 · 比上周更从容</p></div></div><div class="band-track"><span class="filled"></span><span class="filled"></span><span></span></div><div class="band-labels"><span>A2 轻松开口</span><span>B1 自在表达</span><span>B2 拓展观点</span></div><button class="text-btn mt16" data-view="growth">看看我的进步 ${icon('arrow')}</button></section><section class="card coach-card"><div class="coach-icon">${icon('spark')} 给今天的你</div><blockquote>“Progress,<br>not perfection.”</blockquote><p>比完美更重要的，是又迈出了一小步。</p><div class="bottom"><span>ONE SENTENCE A DAY</span><button class="icon-btn" data-action="quote-audio" aria-label="听今日英语金句">${icon('volume')}</button></div></section></aside></div>`}
function explorePage(){const list=topics.filter(t=>(state.filter==='all'||t.band===state.filter)&&(`${t.cn} ${t.en}`.toLowerCase().includes(state.libraryQuery.toLowerCase())));return `${pageHeading('世界很大，想聊什么？','从喜欢的话题开始，让英语走进你的日常。',`<button class="btn btn-secondary btn-sm" data-action="passage">${icon('book')} 篇章跟读</button>`)}<div class="between wrap"><div class="filter-row" aria-label="主题难度筛选">${[['all','全部主题'],['A2','A2 · 轻松开口'],['B1','B1 · 自在表达'],['B2','B2 · 拓展观点']].map(([v,t])=>`<button class="filter ${state.filter===v?'active':''}" data-action="filter" data-id="${v}" aria-pressed="${state.filter===v}">${t}</button>`).join('')}</div><div class="search-box">${icon('search')}<input class="input" id="topic-search" aria-label="搜索主题" placeholder="找一个喜欢的话题" value="${esc(state.libraryQuery)}"></div></div><div class="library-grid" id="topic-results">${list.length?list.map(t=>topicCard(t,true)).join(''):`<div class="empty"><h3>暂时没找到这个主题</h3><p>试试「校园」「宠物」，或切换难度。</p><button class="btn btn-soft" data-action="reset-search">查看全部主题</button></div>`}</div><div class="notice mt24">${icon('compass')} 主题探索是自由练习，不覆盖你的课堂作业。原型将记录当前练习进度；切换任务前会提醒。</div>`}
function currentTopic(){return topics.find(t=>t.id===state.topic)||topics[0]}
function currentItem(){const data=topicLines[state.topic]||topicLines.pets;if(state.mode==='passage')return {type:'passage',text:resources[0].text,zh:'先完整听一遍，再按照自己的节奏朗读。'};if(state.mode==='extra')return {type:'question',text:extraText(),zh:'多说一个同主题问题，把刚刚的好表达再用一次。'};return state.index<3?{type:'repeat',text:data.repeat[state.index],zh:data.zh[state.index]}:{type:'question',text:data.questions[state.index-3]||data.questions[0],zh:'试着说出你的观点，再用一个理由或例子来支持它。'}}
function extraText(){return {pets:'How can we take better care of animals in our community?',school:'What would you change to make your school a better place?',weekend:'What is one new thing you would like to try next weekend?',food:'How could you make your favorite meal healthier?',future:'Who inspires you to follow your dream, and why?',friends:'How do you help a friend who is having a difficult day?'}[state.topic]||topicLines.pets.questions[0]}
function practicePage(){const item=currentItem(),total=['passage','extra'].includes(state.mode)?1:5,done=state.completed.includes(state.index);return `<div class="practice-heading between"><div><div class="row mb8"><button class="text-btn" data-view="home" aria-label="回到学习首页">${icon('back')}</button><span class="tag">${state.mode==='daily'?'今日练习':state.mode==='passage'?'篇章跟读':'自由探索'}</span><span class="small muted">${currentTopic().cn}</span></div><h1>慢慢来，说出你的节奏。</h1></div><button class="btn btn-secondary btn-sm" data-action="save-exit">保存并退出 ${icon('logout')}</button></div><div class="practice-layout"><section class="card practice-card"><div class="between"><span class="small"><strong>第 ${state.index+1} 题</strong><span class="muted"> / ${total} 题</span></span><span class="tag tag-gray">${item.type==='question'?'B1 · 自在表达':item.type==='passage'?'篇章练习':'听后复述'}</span></div><div class="steps" aria-label="练习进度">${Array.from({length:total},(_,i)=>`<span class="step ${state.completed.includes(i)?'done':i===state.index?'current':''}"></span>`).join('')}</div><div class="prompt-label">${icon(item.type==='question'?'chat':'headphones')}${item.type==='question'?'YOUR TURN · 分享你的想法':item.type==='passage'?'READ ALOUD · 让文字有声音':'LISTEN & REPEAT · 听一听，再试着说'}</div><div class="prompt-text ${state.hiddenText?'hidden-prompt':''}">${state.hiddenText?'原文已收起。试着回想刚刚听到的内容。':esc(item.text)}</div><p class="prompt-translation">${state.hiddenText?'想不起来也没关系，随时可以重新看看。':esc(item.zh)}</p><div class="listen-row"><button class="btn btn-soft btn-sm" data-action="listen">${icon('volume')} 听示范</button><div class="row gap8"><label class="sr-only" for="speech-rate">示范语速</label><select id="speech-rate" class="view-switch"><option value=".8">慢速 0.8×</option><option value="1" selected>正常 1.0×</option></select>${item.type!=='question'?`<button class="text-btn" data-action="toggle-text">${icon('eye')} ${state.hiddenText?'显示原文':'收起原文'}</button>`:''}</div></div><div class="record-zone" id="record-zone">${recordZone()}</div><div id="feedback-slot">${done?feedbackHTML():''}</div></section><aside class="stack practice-aside"><section class="card practice-tip"><div class="row gap8">${icon('spark')}<h3>一个小小的提示</h3></div><p>${item.type==='question'?'不用寻找「标准答案」。试试这个顺序，让你的表达更完整。':'先听完整句子，再跟着意群停顿。比起说得快，说得自然更重要。'}</p><span class="tip-word">${item.type==='question'?'I think… because…':'Listen. Pause. Speak.'}</span><p>${item.type==='question'?'我的观点 → 一个理由 → 一个小例子':'听一遍 · 想一想 · 大胆说'}</p></section><section class="card outline-card"><h3 class="mb16">今天的路线</h3>${[['headphones','听后复述','3 个短句'],['chat','情景问答','2 个问题'],['chart','看看收获','专属练习反馈']].map(([ic,title,sub],i)=>`<div class="outline-step ${(state.index<3?0:1)===i?'active':''}"><span class="lesson-number">${icon(ic)}</span><div>${title}<div class="small muted" style="font-size:10px">${sub}</div></div></div>`).join('')}</section><div class="notice">${icon('shield')} 原型支持模拟体验与本机录音。音频不上传；反馈使用固定示例，不评估真实口语水平。</div></aside></div>`}
function recordZone(){if(state.recordStatus==='processing')return `<div class="processing" role="status"><div class="spinner"></div><strong id="processing-label">已加入反馈队列…</strong><p class="record-caption">正在演示异步评测，不发送真实请求</p></div>`;const recording=state.recordStatus==='recording',ready=state.recordStatus==='ready',done=state.completed.includes(state.index);return `<div class="record-mode"><label><input type="radio" name="record-mode" value="demo" ${state.recordMode==='demo'?'checked':''} ${recording?'disabled':''}> 模拟体验</label><label><input type="radio" name="record-mode" value="real" ${state.recordMode==='real'?'checked':''} ${recording?'disabled':''}> 本机真实录音</label></div>${ready?`<div class="row" style="justify-content:center">${icon('checkcircle')}<strong class="small">这一次开口，已记录</strong><span class="time">${formatTime(state.elapsed)}</span></div>${audioURL?`<audio controls src="${audioURL}" aria-label="回听本机录音"></audio>`:''}<div class="record-actions"><button class="btn btn-secondary btn-sm" data-action="play-recording">${icon('play')} ${audioURL?'回听录音':'听示例音频'}</button><button class="btn btn-secondary btn-sm" data-action="rerecord">${icon('repeat')} 再录一次</button><button class="btn btn-primary btn-sm" data-action="submit-recording">看看反馈 ${icon('arrow')}</button></div>`:`<div class="wave ${recording?'active':''}" aria-hidden="true">${'<i></i>'.repeat(31)}</div><button class="record-button ${recording?'recording':''}" data-action="${recording?'stop-recording':'record'}" aria-label="${recording?'结束录音':state.recordMode==='real'?'开始本机录音':'开始模拟录音'}">${icon(recording?'stop':'mic')}</button><p class="record-label">${recording?`<span class="time" id="record-time">${formatTime(state.elapsed)}</span> · 说完后点一下结束`:done?'想再试一次？每一次练习都有意义。':state.recordMode==='real'?'准备好了，就点一下麦克风':'点一下，体验开口练习'}</p><p class="record-caption">${recording?'最长 60 秒 · 不用着急，按自己的节奏说':state.recordMode==='real'?'需要麦克风权限 · 音频仅保留在当前浏览器内存':'模拟模式不会启用麦克风 · 可以放心体验'}</p>`}<p id="record-error" class="error" role="alert"></p>`}
function feedbackHTML(){const item=currentItem(),score=[88,85,82,86,89][state.index]||88;return `<section class="feedback page-enter" aria-label="示例练习反馈"><div class="between"><h3>${icon('checkcircle')} ${item.type==='question'?'你把想法说出来了，很棒！':'这句话，比刚才更有底气。'}</h3><span class="tag tag-gray">示例反馈</span></div><p>${item.type==='question'?'观点已经很清晰了。下次加上一个具体的小例子，会更有说服力。':'句子完整、节奏自然。试着把重音放在关键词上，听起来会更生动。'}</p><div class="score-grid">${item.type==='question'?`<div class="score-cell"><strong>${score}</strong><span>总评参考 · 模型示例</span></div><div class="score-cell"><strong>B1</strong><span>词汇档位 · 词表示例</span></div><div class="score-cell"><strong>6.0</strong><span>模拟分 · 非官方成绩</span></div>`:`<div class="score-cell"><strong>${score}</strong><span>总评参考 · 引擎示例</span></div><div class="score-cell"><strong>92</strong><span>完整度参考</span></div><div class="score-cell"><strong>84</strong><span>流利度参考</span></div>`}</div><div class="between wrap"><button class="text-btn" data-action="rerecord">${icon('repeat')} 再试一次</button><button class="btn btn-primary btn-sm" data-action="next">${state.index===(['passage','extra'].includes(state.mode)?0:4)?'看看本轮收获':'继续下一题'} ${icon('arrow')}</button></div></section>`}
function stat(label,number,note,ico){return `<section class="card stat"><div class="stat-label">${icon(ico)}${label}</div><div class="number">${number}</div><div class="stat-note">${note}</div></section>`}
function growthChart(){const seven=state.period===7;return `<svg class="chart" viewBox="0 0 580 230" role="img" aria-label="${seven?'近7天':'近30天'}口语参考分示例趋势，由${seven?'76':'65'}分提升至88分"><defs><linearGradient id="chart-fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#bcd7be" stop-opacity=".6"/><stop offset="1" stop-color="#bcd7be" stop-opacity="0"/></linearGradient></defs>${[40,90,140,190].map((y,i)=>`<line class="chart-grid" x1="40" y1="${y}" x2="550" y2="${y}"/><text x="8" y="${y+4}">${100-i*20}</text>`).join('')}<path d="${seven?'M48 100 130 83 212 93 294 71 376 63 458 69 542 53':'M48 128 130 111 212 118 294 95 376 89 458 71 542 53'}L542 195H48Z" fill="url(#chart-fill)"/><path class="chart-line" d="${seven?'M48 100 130 83 212 93 294 71 376 63 458 69 542 53':'M48 128 130 111 212 118 294 95 376 89 458 71 542 53'}"/>${(seven?[100,83,93,71,63,69,53]:[128,111,118,95,89,71,53]).map((y,i)=>`<circle class="chart-point" cx="${48+i*82.3}" cy="${y}" r="4"/><text x="${48+i*82.3}" y="222" text-anchor="middle">${seven?['9.20','9.21','9.22','9.23','9.24','9.25','9.26'][i]:['8.28','9.02','9.07','9.12','9.17','9.22','9.26'][i]}</text>`).join('')}<rect x="512" y="15" rx="7" width="50" height="25" fill="var(--green)"/><text x="537" y="32" text-anchor="middle" style="fill:white;font-weight:600">88</text></svg>`}
function growthPage(){return `${pageHeading('每一小步，都算数。','不和别人比。看看今天的自己，比昨天多走了多远。',`<span class="tag">${icon('leaf')} 成长记录 · 示例</span>`)}<div class="stats-grid">${stat('累计开口','128 <small>分钟</small>','相当于完成了 16 次小小挑战','mic')}${stat('完成练习','16 <small>次</small>','每一次认真练习，都会留下痕迹','checkcircle')}${stat('当前练习档位','B1','从 A2 出发，正在自在表达','chart')}${stat('坚持练习','4 <small>天</small>','进步不是直线，坚持就是力量','flame')}</div><div class="between mb16"><div class="tabs">${[['trail','学习轨迹'],['saved','表达收藏']].map(([v,t])=>`<button class="tab ${state.growthTab===v?'active':''}" data-action="growth-tab" data-id="${v}" aria-pressed="${state.growthTab===v}">${t}</button>`).join('')}</div></div>${state.growthTab==='saved'?`<section class="card">${state.saved?`<div class="between"><h2>留住一句好表达</h2><button class="text-btn" data-action="save-expression">${icon('bookmark')} 取消收藏</button></div>${expressionHTML()}`:`<div class="empty">${icon('bookmark')}<h3>第一句好表达，正在等你</h3><p>练习后的升级表达可以收藏在这里，方便下次再用。</p><button class="btn btn-primary" data-action="sample-report">看看示例表达 ${icon('arrow')}</button></div>`}</section>`:`<div class="two-cols"><section class="card"><div class="between"><h2>声音里的进步</h2><div class="tabs">${[7,30].map(n=>`<button class="tab ${state.period===n?'active':''}" data-action="period" data-id="${n}" aria-pressed="${state.period===n}">近 ${n} 天</button>`).join('')}</div></div><p class="small muted mt16">口语总评参考趋势 · 示例数据</p>${growthChart()}<div class="notice notice-green">${icon('chart')} ${state.period===7?'这周的表达更流畅了。偶尔的起伏，也是成长的一部分。':'一个月里，你正在从「说一句」走向「说一段」。'}</div></section><section class="card"><h2>词汇，也在慢慢生长</h2><p class="small muted mt16">来源：分级词表命中分析 · 仅统计自主问答</p><div class="between mt24"><strong style="font-size:44px;letter-spacing:-2px">B1</strong><span class="tag">CEFR 参考档位</span></div><div class="chart-bars">${[['A2 常用表达',78,'12'],['B1 丰富表达',45,'7'],['B2 拓展表达',13,'2']].map(([l,p,n])=>`<div class="chart-bar"><span>${l}</span><div class="progress-line"><span style="width:${p}%"></span></div>< function cleanupRecording(){recordGeneration++;clearInterval(timer);clearTimeout(processingTimer);timer=null;processingTimer=null;if(recorder&&recorder.state!=='inactive'){recorder.onstop=null;recorder.stop()}stream?.getTracks().forEach(t=>t.stop());stream=null;recorder=null;if(audioElement){audioElement.pause();audioElement=null}if(audioURL){URL.revokeObjectURL(audioURL);audioURL=null}state.elapsed=0}
async function startRecording(){if(state.recordStatus==='recording')return;cleanupRecording();if('speechSynthesis'in window)speechSynthesis.cancel();const generation=recordGeneration;if(state.recordMode==='real'){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('#record-error').textContent='当前环境无法录音。请使用 localhost 或 HTTPS 打开，或选择模拟体验。';return}const button=$('[data-action="record"]');if(button){button.disabled=true;button.setAttribute('aria-label','等待麦克风权限')}try{const acquired=await navigator.mediaDevices.getUserMedia({audio:true});if(generation!==recordGeneration||state.view!=='practice'){acquired.getTracks().forEach(t=>t.stop());return}stream=acquired;recorder=new MediaRecorder(stream);recordChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{if(generation!==recordGeneration)return;const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});if(!blob.size){state.recordStatus='idle';updateRecordZone();$('#record-error').textContent='没有捕获到音频，请检查麦克风后重试。';return}audioURL=URL.createObjectURL(blob);state.recordStatus='ready';updateRecordZone()};recorder.onerror=()=>{cleanupRecording();state.recordStatus='idle';updateRecordZone();$('#record-error').textContent='录音设备出现问题，请重试或使用模拟体验。'};recorder.start()}catch(error){cleanupRecording();state.recordStatus='idle';updateRecordZone();$('#record-error').textContent=error.name==='NotAllowedError'?'麦克风权限未开启。允许访问后重试，或切换「模拟体验」。':'没有找到可用麦克风，请检查连接或切换「模拟体验」。';return}}state.recordStatus='recording';state.elapsed=0;state.feedback=false;recordStart=Date.now();updateRecordZone();$('#feedback-slot').innerHTML='';timer=setInterval(()=>{state.elapsed=Math.floor((Date.now()-recordStart)/1000);if($('#record-time'))$('#record-time').textContent=formatTime(state.elapsed);if(state.elapsed>=60)stopRecording()},250)}
function updateRecordZone(){if($('#record-zone'))$('#record-zone').innerHTML=recordZone()}
function stopRecording(){if(state.recordStatus!=='recording')return;state.elapsed=Math.floor((Date.now()-recordStart)/1000);if(state.elapsed<1){$('#record-error').textContent='刚刚太短啦，试着说满一句话，再结束录音。';return}clearInterval(timer);timer=null;if(recorder&&recorder.state==='recording'){recorder.stop();stream?.getTracks().forEach(t=>t.stop());stream=null}else{state.recordStatus='ready';updateRecordZone()}}
function submitRecording(){if(state.recordStatus!=='ready')return;state.recordStatus='processing';updateRecordZone();const generation=recordGeneration;processingTimer=setTimeout(()=>{if(generation!==recordGeneration)return;if($('#processing-label'))$('#processing-label').textContent='正在整理本次练习反馈…';processingTimer=setTimeout(()=>{if(generation!==recordGeneration||state.view!=='practice')return;if(!state.completed.includes(state.index))state.completed.push(state.index);state.completed.sort((a,b)=>a-b);state.recordStatus='idle';state.feedback=true;persist();updateRecordZone();$('#feedback-slot').innerHTML=feedbackHTML();$('#feedback-slot').scrollIntoView({behavior:'smooth',block:'nearest'})},750)},550)}
function launch(mode='daily',topic='pets',force=false){if(!state.joined&&mode==='daily'){joinDialog();return}if(!force&&(state.mode!==mode||state.topic!==topic)&&state.completed.length){modal('切换一个新的练习？','<p>原型只保留一轮当前练习。开始新任务会清空当前题号进度，收藏和每周目标不受影响。正式版会按课堂和日期分别保存。</p><div class="modal-footer"><button class="btn btn-secondary" data-action="close-modal">先不切换</button><button class="btn btn-primary" data-action="confirm-launch" data-id="'+mode+'|'+topic+'">开始新练习</button></div>');return}if(state.mode!==mode||state.topic!==topic||force){state.completed=[];state.index=0}state.mode=mode;state.topic=topic;state.sampleReport=false;state.hiddenText=false;if(state.completed.length===(mode==='passage'||mode==='extra'?1:5)){go('result');return}state.index=Array.from({length:mode==='passage'||mode==='extra'?1:5},(_,i)=>i).find(i=>!state.completed.includes(i))??0;persist();go('practice')}

function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;const source=text.replace(/^\uFEFF/,'');for(let i=0;i<source.length;i++){const c=source[i];if(c==='"'){if(quoted&&source[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&source[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw new Error('CSV 引号没有闭合，请检查文件。');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
async function importWords(file){if(!file)return;pendingWords=[];$('#word-preview').innerHTML='';$('#word-error').textContent='';if(file.size>1024*1024){$('#word-error').textContent='文件超过 1 MB，请精简词表后再试。';return}try{const rows=parseCSV(await file.text());if(!rows.length)throw new Error('文件为空，请先添加 word、band 列。');const headers=rows.shift().map(h=>h.trim().toLowerCase());const wi=headers.indexOf('word'),bi=headers.indexOf('band');if(wi<0||bi<0)throw new Error('缺少 word 或 band 列，请下载模板对照。');if(!rows.length)throw new Error('只有表头，还没有词条。');const seen=new Set();pendingWords=rows.map((r,i)=>{const word=(r[wi]||'').trim().toLowerCase(),band=(r[bi]||'').trim().toUpperCase();if(!/^[a-z]+(?:[-'][a-z]+)*$/.test(word))throw new Error(`第 ${i+2} 行的 word 需为有效英文单词。`);if(!['A2','B1','B2'].includes(band))throw new Error(`第 ${i+2} 行档位无效，仅支持 A2 / B1 / B2。`);if(seen.has(word))throw new Error(`第 ${i+2} 行单词 ${word} 重复，请先去重。`);seen.add(word);return {word,band}});if(!$('#word-preview'))return;$('#word-preview').innerHTML=`<div class="notice notice-green mt16">${icon('checkcircle')} 校验通过：${pendingWords.length} 个词条，A2 ${pendingWords.filter(w=>w.band==='A2').length} / B1 ${pendingWords.filter(w=>w.band==='B1').length} / B2 ${pendingWords.filter(w=>w.band==='B2').length}。</div><div class="word-tags mt16">${pendingWords.slice(0,12).map(w=>`<span>${esc(w.word)} · ${w.band}</span>`).join('')}</div><button class="btn btn-primary btn-sm mt16" data-action="confirm-words">预览无误，替换演示词表</button>`}catch(error){pendingWords=[];if($('#word-error'))$('#word-error').textContent=error.message}}
function downloadCSV(name,rows){const csv=rows.map(row=>row.map(v=>{let cell=String(v??'');if(/^[=+@\-\t\r]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

 'attempt-detail':id=>attemptDialog(Number(id)),
 'sample-answer':id=>speak(Number(id)>=3||state.mode==='extra'?'I think we should be kind to animals. For example, we can give them clean water and a safe place to live.':state.mode==='passage'?resources[0].text:(topicLines[state.topic]||topicLines.pets).repeat[Number(id)]),
 'retry-item':id=>{closeModal();state.index=Number(id);state.sampleReport=false;go('practice')},
 'join':joinDialog,
 'copy-code':copyCode,
 'share-class':()=>modal('把课堂分享给学生','<span class="tag">七年级（2）班 · 示例</span><div class="class-code">DEMO01</div><p>学生打开「我的课堂」，输入课堂码和显示名即可加入。原型中的课堂码只进入示例课堂。</p><div class="modal-footer"><button class="btn btn-primary" data-action="copy-code">'+icon('copy')+' 复制课堂码</button></div>'),
 'student-detail':studentDialog,
 'student-audio':()=>speak('I like my dog because he is always happy to see me. We often play in the park together.'),
 'export':()=>{downloadCSV('SpeakUp-课堂示例.csv',[['显示名','区分码','档位','完成题数','总评参考（示例）','状态'],...students.map(s=>[s.name,s.suffix,s.band,s.done,s.score??'',s.status==='done'?'已完成':s.status==='practicing'?'练习中':'8天未练习'])]);toast('已导出示例名单，不包含真实学生信息')},
 'teaching-tip':()=>modal('一堂 10 分钟的开口小练习','<div class="check-list"><div><span class="tag">01 · 2 分钟</span><h3 class="mt16">听一遍，找一句</h3><p class="small muted">老师播放示范音，学生选一句最想尝试的表达。</p></div><div><span class="tag">02 · 5 分钟</span><h3 class="mt16">各自说，再回听</h3><p class="small muted">完成复述与问答，允许暂停和重录，不公开比较分数。</p></div><div><span class="tag">03 · 3 分钟</span><h3 class="mt16">分享一个进步</h3><p class="small muted">每人说一个自己做得不错的地方，并给下一次定一个小目标。</p></div></div>'),
 'preview-resource':previewResource,
 'resource-audio':id=>{const r=resources.find(x=>x.id===id);if(r)speak(r.text)},
 'admin-tab':id=>{state.adminTab=id;render()},
 'edit-resource':resourceEditor,
 'new-resource':()=>resourceEditor(''),
 'new-class':()=>modal('创建一个演示课堂','<form id="class-form" novalidate><div class="field"><label for="class-name">课堂名称</label><input class="input" id="class-name" name="name" maxlength="40" placeholder="例如：八年级（1）班"></div><p class="small muted">课堂码自动生成。仅创建原型数据，不影响现有平台。</p><p id="class-error" class="error" role="alert"></p><div class="modal-footer"><button type="button" class="btn btn-secondary" data-action="close-modal">取消</button><button class="btn btn-primary" type="submit">创建课堂</button></div></form>'),
 'toggle-class':id=>{const c=classrooms[Number(id)];if(!c)return;modal(c.active?'停用这个课堂？':'重新启用课堂？',`<p>${esc(c.name)} · ${c.code}<br>${c.active?'正式平台中，停用后学生将无法通过该课堂码进入。现有学习记录应保留。':'启用后将恢复课堂码入口。'}本次操作仅改变原型展示。</p><div class="modal-footer"><button class="btn btn-secondary" data-action="close-modal">取消</button><button class="btn ${c.active?'btn-danger':'btn-primary'}" data-action="apply-class-state" data-id="${id}">确认${c.active?'停用':'启用'}</button></div>`)},
 'apply-class-state':id=>{classrooms[Number(id)].active=!classrooms[Number(id)].active;closeModal();render();toast('演示课堂状态已更新')},
 'word-template':()=>downloadCSV('SpeakUp-词表模板.csv',[['word','band'],['friend','A2'],['companion','B1'],['perspective','B2']]),
 'confirm-words':()=>{if(!pendingWords.length)return;modal('替换当前演示词表？',`<p>将以 ${pendingWords.length} 个新词条整体替换当前 ${wordList.length} 个演示词条。此操作不影响服务器词表，刷新页面可恢复默认示例。</p><div class="modal-footer"><button class="btn btn-secondary" data-action="close-modal">再检查一下</button><button class="btn btn-primary" data-action="apply-words">确认替换</button></div>`)},
 'apply-words':()=>{wordList=[...pendingWords];pendingWords=[];closeModal();render();toast('演示词表已替换，统计已更新')},
 'device-test':()=>speak('Hello! Welcome to SpeakUp. Your voice matters. Take a small step today.')
};
document.addEventListener('click',event=>{const view=event.target.closest('[data-view]');if(view){navigate(view.dataset.view);return}const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=actions[target.dataset.action];if(action)action(target.dataset.id,target)});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='role-switch'){const view=el.value==='teacher'?'teacher':el.value==='admin'?'admin':'home';navigate(view)}if(el.name==='record-mode'){cleanupRecording();state.recordMode=el.value;state.recordStatus='idle';updateRecordZone();if($('#feedback-slot'))$('#feedback-slot').innerHTML=state.completed.includes(state.index)?feedbackHTML():''}if(el.id==='student-filter'){state.teacherFilter=el.value;$('#student-rows').innerHTML=teacherRows()}if(el.id==='word-file')importWords(el.files[0])});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='student-search'){state.teacherQuery=el.value.trim();$('#student-rows').innerHTML=teacherRows()}if(el.id==='topic-search'){state.libraryQuery=el.value;const list=topics.filter(t=>(state.filter==='all'||t.band===state.filter)&&(`${t.cn} ${t.en}`.toLowerCase().includes(state.libraryQuery.toLowerCase())));$('#topic-results').innerHTML=list.length?list.map(t=>topicCard(t,true)).join(''):'<div class="empty"><h3>暂时没找到这个主题</h3><p>试试「校园」「宠物」，或切换难度。</p><button class="btn btn-soft" data-action="reset-search">查看全部主题</button></div>'}});
document.addEventListener('submit',event=>{const form=event.target;if(form.id==='join-form'){event.preventDefault();const data=new FormData(form),name=String(data.get('name')).trim(),code=String(data.get('code')).trim().toUpperCase();if(!name){$('#join-error').textContent='先告诉我们你的显示名吧。';$('#join-name').focus();return}if(code!=='DEMO01'){$('#join-error').textContent='还没找到这个课堂。原型请使用 DEMO01，正式版请向老师核对。';$('#join-code').focus();return}state.name=name;state.joined=true;persist();closeModal();go('classroom');toast('欢迎加入课堂，'+name+'！')}
 if(form.id==='resource-form'){event.preventDefault();const data=new FormData(form),title=String(data.get('title')).trim(),topic=String(data.get('topic')).trim(),band=String(data.get('band'));if(!title||!topic){$('#resource-error').textContent='请填写英文标题和中文主题。';return}const existing=resources.find(r=>r.id===form.dataset.id);let text=existing?.text||'',repeats=existing?.repeats||[],questions=existing?.questions;if(form.dataset.kind==='scenarios'){questions={};for(const b of ['A2','B1','B2']){questions[b]=String(data.get('questions-'+b)).split('\n').map(s=>s.trim()).filter(Boolean);if(questions[b].length!==2){$('#resource-error').textContent=b+' 档需要 2 道问法，每行一题。';return}}if(!text)text=questions.B1[0]}else{text=String(data.get('text')).trim();repeats=String(data.get('repeats')).split('\n').map(s=>s.trim()).filter(Boolean);if(!text||repeats.length!==3){$('#resource-error').textContent='请填写篇目原文，并提供 3 个复述句，每行一句。';return}}const selectedFile=$('#content-audio')?.files?.[0];if(selectedFile&&selectedFile.size>20*1024*1024){$('#resource-error').textContent='音频不能超过 20 MB。';return}const item={id:existing?.id||'content-'+Date.now(),title,topic,band,text,repeats,questions,audio:selectedFile?.name||existing?.audio||''};if(existing)resources[resources.indexOf(existing)]=item;else resources.push(item);closeModal();render();toast('原型内容已保存；刷新页面会恢复演示数据')}
 if(form.id==='class-form'){event.preventDefault();const name=String(new FormData(form).get('name')).trim();if(!name){$('#class-error').textContent='请填写课堂名称。';return}if(classrooms.some(c=>c.name===name)){$('#class-error').textContent='已有同名演示课堂，请换一个名字。';return}const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code;do{code=Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>chars[n%chars.length]).join('')}while(classrooms.some(c=>c.code===code));classrooms.push({name,code,active:true});closeModal();render();toast('演示课堂已创建，课堂码 '+code)}
});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal()}});
window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);if(['home','practice','explore','growth','result','classroom','teacher','students','teaching','admin','classrooms','help'].includes(view))navigate(view)});
window.addEventListener('pagehide',()=>{cleanupRecording();if('speechSynthesis'in window)speechSynthesis.cancel()});
const initialView=location.hash.slice(1);go(['home','practice','explore','growth','result','classroom','teacher','students','teaching','admin','classrooms','help'].includes(initialView)?initialView:'home');
</script>
</body>
