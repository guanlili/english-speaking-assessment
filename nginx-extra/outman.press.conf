# 遇己（yujee）: outman.press → 宿主机 :8080（yujee-web）
# compose 挂载到 speakup-frontend:/etc/nginx/conf.d/outman.press.conf

server {
  listen 80;
  server_name outman.press www.outman.press;
  location / {
    return 301 https://outman.press$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name outman.press www.outman.press;

  ssl_certificate     /etc/nginx/ssl/outman.press/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/outman.press/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 100m;

  location / {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
