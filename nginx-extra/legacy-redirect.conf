# 旧域名 301 → 主域名（域名迁移期用）。
# 默认不生效：entrypoint 只有在 LEGACY_DOMAIN / PRIMARY_DOMAIN 两个环境变量
# 均非空、且 /etc/nginx/ssl/legacy/ 下证书齐备时，才会把本文件替换占位符后
# 拷进 /etc/nginx/conf.d/legacy-redirect.conf。
# 占位符：__LEGACY_DOMAIN__（旧域名）、__PRIMARY_DOMAIN__（新主域名）

server {
  listen 80;
  server_name __LEGACY_DOMAIN__;

  client_max_body_size 20m;

  # 80 端口也直接跳新域名，避免旧链接多跳一次 https
  location / {
    return 301 https://__PRIMARY_DOMAIN__$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name __LEGACY_DOMAIN__;

  # 旧域名专用证书：迁移期两份证书并行，主域名证书由部署流程维护
  ssl_certificate /etc/nginx/ssl/legacy/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/legacy/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 20m;

  location / {
    return 301 https://__PRIMARY_DOMAIN__$request_uri;
  }
}
