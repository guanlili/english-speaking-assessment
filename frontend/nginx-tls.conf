# TLS 模式配置：entrypoint 检测到 /etc/nginx/ssl/fullchain.pem 时启用。
# 80 端口保留 /api 反代（部署就绪检查 / 健康探测走 http），其余全部跳转 https；
# 443 承载全部流量——浏览器麦克风权限（getUserMedia）只在安全上下文开放。

# PK 对局 SSE 长连接按客户端 IP 计数的共享内存区（http 上下文；本文件被
# include 进 nginx http 块）。口径见 443 server 内 SSE location 注释。
limit_conn_zone $binary_remote_addr zone=pk_sse_per_ip:10m;

server {
  listen 80;

  client_max_body_size 20m;

  # 部署脚本/监控的 http 探测口保留（相对路径 API 前端只会走 https）
  location /api {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆写而非追加：杜绝客户端伪造 XFF 链绕过按 IP 限流（同 nginx.conf）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;

  ssl_certificate /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # HSTS：强制浏览器后续只走 https（一年）。不带 includeSubDomains——
  # www 子域仍指向旧隧道，等子域收拢后再开启
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # PK 对局 SSE 长连接（/classes/{code}/vocabulary/pk/matches/{id}/events）：
  # 关闭缓冲/缓存、走 HTTP/1.1 长连接、放宽读写超时，避免 nginx 把事件攒成
  # 一批下发（表现为对手状态延迟数秒才刷新）。后端 StreamingResponse 已带
  # X-Accel-Buffering: no / Cache-Control: no-cache，这里是入口侧双保险。
  location ~ ^/api/v1/classes/[^/]+/vocabulary/pk/matches/[^/]+/events$ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "no-cache" always;
    # location 内一旦出现 add_header 就不再继承 server 级头，HSTS 需在此重复
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 连接上限口径：按客户端 IP 限制同时挂起的 SSE 连接数。刻意不设低值——
    # 整班学生常走同一校园 NAT 出口共享一个公网 IP，64 留足单班 40 人 +
    # 断线重连余量；不同班级 / 不同 NAT 出口互不影响。超限返回 503，
    # 前端既有降级路径会切 1.5s 轮询，比赛不暂停。
    limit_conn pk_sse_per_ip 64;
  }

  location /api {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆写而非追加：杜绝客户端伪造 XFF 链绕过按 IP 限流（同 nginx.conf）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # location 内一旦出现 add_header 就不再继承 server 级头，HSTS 需在此重复
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  location /redoc {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires max;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;

    # index.html 不缓存，保证部署后用户拿到新版本
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    # CSP：脚本只允许同源（无内联脚本、无 eval、无 CDN），token 存 localStorage
    # 时这是最后一道 XSS 防线；style 保留 unsafe-inline（React/Radix 需内联样式）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
  }
}
